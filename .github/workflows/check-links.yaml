name: Check links

# Check links in every tracked file under records/, including sidecar metadata.
# PRs check changed files, or all files when the checker changes. This isn't a
# required check, since external sites flap. Weekly runs report to one issue.
on:
  pull_request:
    paths:
      - "records/**"
      - "lychee.toml"
      - ".github/workflows/check-links.yaml"
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lychee:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need the base commit to diff against

      # Explicit inputs bypass Lychee's default directory extension filter.
      # Keep filenames out of action args: lychee-action evaluates them as shell.
      - name: Pick catalog files to check
        id: files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p lychee
          if [ "$GITHUB_EVENT_NAME" != pull_request ] || \
            ! git diff --quiet "$BASE_SHA" HEAD -- lychee.toml .github/workflows/check-links.yaml; then
            git ls-files -- records/ > lychee/inputs.txt
          else
            git diff --name-only --diff-filter=d "$BASE_SHA" HEAD -- \
              records/ > lychee/inputs.txt
          fi
          if [ -s lychee/inputs.txt ]; then
            echo "has_files=true" >> "$GITHUB_OUTPUT"
          else
            echo "No catalog files to check."
          fi

      - name: Check record links
        id: lychee
        if: steps.files.outputs.has_files == 'true'
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --config lychee.toml --files-from lychee/inputs.txt
          output: lychee/out.md
          fail: ${{ github.event_name == 'pull_request' }}
          # Sidecar metadata may contain no links (e.g. a class-code table).
          failIfEmpty: false

      # Exit 2 means broken links; other nonzero exits are checker failures.
      - name: Fail on checker errors
        if: >-
          steps.lychee.outputs.exit_code != '' &&
          steps.lychee.outputs.exit_code != '0' &&
          steps.lychee.outputs.exit_code != '2'
        run: |
          echo "::error::Lychee could not complete the check. See the link-check step."
          exit 1

      # Reuse one open issue so failures don't pile up a new issue each week.
      - name: Report broken links
        if: github.event_name != 'pull_request' && steps.lychee.outputs.exit_code == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create broken-links --color d93f0b --description "Found by the weekly link check" --force
          issue=$(gh issue list --label broken-links --state open --json number --jq '.[0].number')
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --body-file lychee/out.md
          else
            gh issue create --title "Broken links in catalog records" --label broken-links --body-file lychee/out.md
          fi

      # Closing means the next breakage opens a new issue, which notifies watchers.
      - name: Close fixed broken-links issue
        if: github.event_name != 'pull_request' && steps.lychee.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue=$(gh issue list --label broken-links --state open --json number --jq '.[0].number')
          [ -z "$issue" ] || gh issue close "$issue" \
            --comment "All links pass: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
