name: Validate records

on:
  # Required workflows must run for every PR so GitHub receives a status.
  # `changed-only` below skips record validation when records/ is unchanged.
  pull_request:

permissions:
  contents: read

jobs:
  # Validate only the records changed in this PR against the CDH metadata schema.
  # Pin the workflow ref (@…) and tooling-ref to a release tag once a release
  # includes the changed-only input; using @main until then.
  validate:
    uses: CGIAR-Climate-Data-Hub/cdh-metadata-standard/.github/workflows/validate-records.yaml@main
    with:
      path: records
      changed-only: true
      tooling-ref: v0.3.0
