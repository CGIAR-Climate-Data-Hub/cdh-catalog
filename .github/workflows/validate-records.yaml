name: Validate records

on:
  # Required workflows must run for every PR so GitHub receives a status.
  # `changed-only` below skips record validation when records/ is unchanged.
  pull_request:

permissions:
  contents: read

jobs:
  # Validate only the records changed in this PR. Each record is checked with
  # the release its cdh_schema_version names, so mixed versions are fine.
  validate:
    uses: CGIAR-Climate-Data-Hub/cdh-metadata-standard/.github/workflows/validate-records.yaml@v0.4.0
    with:
      path: records
      changed-only: true
