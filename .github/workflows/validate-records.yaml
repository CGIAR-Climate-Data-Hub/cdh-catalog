name: Validate records

on:
  # Required workflows must run for every PR so GitHub receives a status.
  # `changed-only` below skips record validation when records/ is unchanged.
  pull_request:

permissions:
  contents: read

jobs:
  # Validate only the records changed in this PR. Each record is checked with
  # the release its cdh_schema_version names, so mixed versions are fine.
  validate:
    uses: CGIAR-Climate-Data-Hub/cdh-metadata-standard/.github/workflows/validate-records.yaml@v0.4.0
    with:
      path: records
      changed-only: true

  # Warn (don't fail) when a changed record names an older release than the
  # latest. Same note submit-issue.yml posts on the submission issue.
  latest-version:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Compare cdh_schema_version to latest release
        run: |
          latest=$(gh release view --repo CGIAR-Climate-Data-Hub/cdh-metadata-standard --json tagName -q .tagName)
          for f in $(gh pr diff ${{ github.event.number }} --name-only | grep -E '^records/.*\.ya?ml$'); do
            [ -f "$f" ] || continue  # skip files deleted by the PR
            v=$(yq '.cdh_schema_version' "$f")
            [ "$v" = "$latest" ] || echo "::warning file=$f::cdh_schema_version is $v; latest release is $latest"
          done
