name: Submit metadata record
description: Submit a CDH metadata record generated by the CDH Metadata Generator for review
title: "[Submission]: "
labels: [submission]
body:
  - type: markdown
    attributes:
      value: |
        This form is filled in automatically by the
        [CDH Metadata Generator](https://anaguilarar.github.io/CDH-metadata-app/) — you
        shouldn't normally need to type into it by hand. Submitting this issue does not
        publish anything by itself: a bot checks the record, opens a pull request from it,
        and a CDH team member reviews and merges that PR before the record goes live.

  - type: input
    id: record_id
    attributes:
      label: Record ID
      description: The record's `id` field — lowercase letters, digits, and hyphens only.
      placeholder: e.g. chirts-era5-daily
    validations:
      required: true

  - type: textarea
    id: yaml_content
    attributes:
      label: Full YAML record
      description: >
        The complete YAML produced by the CDH Metadata Generator's "Generate YAML" step.
        Paste it here unmodified.
      render: yaml
    validations:
      required: true
