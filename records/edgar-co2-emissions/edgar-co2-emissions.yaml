# yaml-language-server: $schema=https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/schemas/profiles/cdh.schema.json
cdh_schema_version: v0.5.0
extensions:
- https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/cdh/schema.json
id: edgar-co2-emissions
version: '1'
title: EDGAR CO2 Emissions Gridmaps (v2025 GHG release)
description: Gridded CO2 emissions from human activities in the Emissions Database for Global Atmospheric Research (EDGAR)
  v2025 GHG release, provided as monthly emission gridmaps at 0.1 x 0.1 degree resolution in NetCDF. Used in the Lake Victoria
  Basin land-degradation / landscape-integrity assessment as the anthropogenic CO2 emission pressure layer.
license: CC-BY-NC-ND-4.0
resource_type: dataset
access: public
note: EDGAR material is generally CC-BY-4.0, but the IEA-EDGAR CO2 component is licensed CC-BY-NC-ND-4.0 per the source page;
  confirm the applicable terms for your reuse. Period shown is the assessment window (1997-2024).
created: '2026-10-28'
updated: '2026-10-28'
keywords:
- CO2 emissions
- gridded emissions
- NetCDF
- fossil emissions
contact:
- organization: European Commission Joint Research Centre (JRC) - EDGAR
  name: EDGAR Team
  email: JRC-EDGAR@ec.europa.eu
  roles:
  - licensor
  - producer
- organization: European Commission Joint Research Centre (JRC) - EDGAR
  name: EDGAR Team
  email: JRC-EDGAR@ec.europa.eu
  roles:
  - maintainer
citation:
  title: EDGAR Emissions Database for Global Atmospheric Research (v2025 GHG)
  authors:
  - organization: European Commission JRC
  date: '2025'
  publisher: JRC EDGAR
related_publications:
- doi: 10.1038/s41597-019-0312-2
spatial:
  bbox:
  - -180.0
  - -90.0
  - 180.0
  - 90.0
  crs: EPSG:4326
temporal:
  start_date: '1997'
  end_date: '2024'
  update_frequency: annual
structures:
- name: grid
  dimensions:
  - name: cell
    type: xy
    step: 0.1
    unit: degree
    description: EDGAR 0.1-degree grid cell.
  - name: year
    type: temporal
    data_type: integer
    step: P1Y
    extent:
    - '1997'
    - '2024'
    description: Map year.
  variables:
  - name: co2_emissions
    description: Monthly CO2 emission mass per grid cell.
    data_type: number
    unit: Mg
cdh:
  domain:
  - climate
  - mitigation
data:
- name: edgar-ghg2025
  description: EDGAR v2025 GHG release landing page and downloads (CO2 gridmaps, NetCDF).
  locations:
  - url: https://edgar.jrc.ec.europa.eu/dataset_ghg2025
  media_type: text/html
