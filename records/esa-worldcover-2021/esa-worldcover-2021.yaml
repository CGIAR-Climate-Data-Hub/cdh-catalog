created: "2026-10-15"
updated: "2026-10-15"

spatial:
  bbox: [-180, -60, 180, 84]
  crs: EPSG:4326
  geography: [world]

temporal:
  date: "2021"

structures:
  - name: map
    dimensions:
      - name: cell
        type: xy
        description: 1/12000 degree (~10 m at the equator), on a 3x3 degree tile grid.
        step: 0.0000833333
        unit: degree
    variables:
      - name: map
        description: >
          Land cover class of the pixel. Cropland (40) is annual herbaceous crops only; tree crops
          and plantations are tree cover (10) and pasture is grassland (30).
        data_type: uint8
        nodata: 0
        categories:
          - value: 10
            label: Tree cover
          - value: 20
            label: Shrubland
          - value: 30
            label: Grassland
          - value: 40
            label: Cropland
          - value: 50
            label: Built-up
          - value: 60
            label: Bare/sparse vegetation
          - value: 70
            label: Snow and ice
          - value: 80
            label: Permanent water bodies
          - value: 90
            label: Herbaceous wetland
          - value: 95
            label: Mangroves
          - value: 100
            label: Moss and lichen

cdh:
  domain: [land]
  usage:
    intended_uses:
      - land cover masks and strata for sampling, zonal statistics and model inputs
      - cropland, built-up and tree cover extent baselines and their share of administrative units
      - habitat, wetland and mangrove extent for exposure and conservation assessment
    not_recommended_for:
      - use: land cover change against the 2020 map
        reason: the 2020 (v100) and 2021 (v200) maps use different algorithms, so differences mix real and methodological change.
      - use: crop type, tree crop or pasture mapping
        reason: cropland is annual herbaceous crops only; plantations fall under tree cover and pasture under grassland.
        use_instead: ESA WorldCereal for temporary crop extent and type, or a land use product.

processing:
  - id: source
    description: >
      Sentinel-1 GRD and Sentinel-2 L2A observations from 2021 classified with the WorldCover v2
      algorithm (CatBoost gradient-boosted decision trees) by the ESA WorldCover consortium, and
      distributed by VITO as 3x3 degree cloud-optimized GeoTIFF tiles on Terrascope, Zenodo and AWS
      Open Data.
    derived_from:
      - title: ESA WorldCover 10 m 2021 v200
        url: https://doi.org/10.5281/zenodo.7254221
        version: v200
  - id: index
    description: >
      VRT mosaic over the tiles, laid out from the producer's tile grid, with the class legend and
      colour table exported to class-codes.json. No data is copied.
    code:
      url: https://github.com/CGIAR-Climate-Data-Hub/cdh-data-pipeline/blob/main/recipes/esa_worldcover.py
      version: 71c767d
    date: "2026-10-15"

data:
  - name: WorldCover COGs
    description: >
      2,651 tiles named ESA_WorldCover_10m_2021_v200_<N|S>yy<E|W>xxx_Map.tif by their lower-left
      corner.
    locations:
      - url: https://esa-worldcover.s3.amazonaws.com/v200/2021/map/
        title: HTTPS
      - url: s3://esa-worldcover/v200/2021/map/
        title: S3 (no credentials)
    media_type: image/tiff; application=geotiff; profile=cloud-optimized
    processing_steps: [source]
    file_index:
      - format: vrt
        title: Global mosaic; tile paths are HTTPS
        media_type: application/xml
        locations:
          - url: https://digital-atlas.s3.amazonaws.com/cdh/data/esa-worldcover-2021-v200/map.vrt
            title: HTTPS
          - url: s3://digital-atlas/cdh/data/esa-worldcover-2021-v200/map.vrt
            title: S3
  - name: earth-engine
    description: Image collection with one image for 2021, band Map. Needs an Earth Engine account.
    locations:
      - url: ee://ESA/WorldCover/v200
        title: Earth Engine
      - url: https://earthengine.googleapis.com/v1/projects/earthengine-public/assets/ESA/WorldCover/v200
        title: Earth Engine REST API
    processing_steps: [source]
  - name: planetary-computer
    description: >
      The same tiles on Azure, in the esa-worldcover STAC collection alongside the 2020 map (filter
      esa_worldcover:product_version to 2.0.0). Reads need a short-lived SAS token from the
      Planetary Computer signing API. The sibling input_quality prefix holds the full quality layer;
      AWS has only one of its 2,651 tiles.
    locations:
      - url: https://ai4edataeuwest.blob.core.windows.net/esa-worldcover/v200/2021/map/
        title: Azure Blob (SAS token)
    media_type: image/tiff; application=geotiff; profile=cloud-optimized
    processing_steps: [source]

additional_assets:
  - name: class-codes
    description: Class code to name and hex colour, read from the tiles' legend and colour table.
    locations:
      - url: https://digital-atlas.s3.amazonaws.com/cdh/data/esa-worldcover-2021-v200/class-codes.json
        title: HTTPS
      - url: s3://digital-atlas/cdh/data/esa-worldcover-2021-v200/class-codes.json
        title: S3
    media_type: application/json
    roles: [metadata, describedby]
    file_size: 1 KB
  - name: tile-grid
    description: Footprints of the 2,651 tiles with their ll_tile name, from the producer.
    locations:
      - url: https://esa-worldcover.s3.amazonaws.com/v200/2021/esa_worldcover_grid.fgb
    media_type: application/flatgeobuf
    roles: [metadata]
  - name: product-user-manual
    description: Product User Manual v2.0, with class definitions and the algorithm description.
    locations:
      - url: https://esa-worldcover.s3.amazonaws.com/v200/2021/docs/WorldCover_PUM_V2.0.pdf
    media_type: application/pdf
    roles: [describedby]
  - name: validation-report
    description: Product Validation Report v2.0, with the global and regional accuracy figures.
    locations:
      - url: https://esa-worldcover.s3.amazonaws.com/v200/2021/docs/WorldCover_PVR_V2.0.pdf
    media_type: application/pdf
    roles: [validation]

