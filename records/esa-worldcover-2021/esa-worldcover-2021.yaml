# yaml-language-server: $schema=https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/schemas/profiles/cdh.schema.bundled.json
# Federated record: the COG tiles live on AWS Open Data; the Hub publishes only a VRT mosaic and a
# class-code list that open them in place. Earth Engine and Planetary Computer copies are listed as
# further access paths.
cdh_schema_version: v0.5.0
extensions:
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/cdh/schema.json

id: esa-worldcover-2021
title: ESA WorldCover 2021 global land cover at 10 m
version: v200
series:
  name: ESA WorldCover
  url: https://esa-worldcover.org/en
description: >
  Global land cover map for the year 2021 at 10 m, classifying every land pixel between 60 degrees
  south and 84 degrees north into 11 classes from Sentinel-1 radar and Sentinel-2 optical time
  series. Produced by the ESA WorldCover consortium for the European Space Agency (ESA), with a
  validated global overall accuracy of 76.7%. Used for land cover stratification and masking,
  cropland and built-up extent baselines, and habitat and exposure mapping. AWS Open Data serves the
  map as 2,651 cloud-optimized GeoTIFF tiles of 3x3 degrees, and the Hub publishes a GDAL virtual
  raster (VRT) that opens them as one global mosaic.
resource_type: dataset
license: CC-BY-4.0
attribution: >
  © ESA WorldCover project 2021 / Contains modified Copernicus Sentinel data (2021) processed by
  ESA WorldCover consortium

keywords:
  - land cover
  - land cover classification
  - LULC
  - Sentinel-1
  - Sentinel-2
  - WorldCover
  - ESA

note: >
  Pixels are 1/12000 degree, so their ground area shrinks with latitude; weight by pixel area or
  reproject to an equal-area grid before computing area statistics. The VRT references the tiles
  over HTTPS with /vsicurl, so open it with GDAL-based tools (rasterio, terra, stars) and read a
  window at a time. Avoid reading the full map at once, as the whole map is about 117 GB.

