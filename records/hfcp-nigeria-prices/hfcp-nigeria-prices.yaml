# yaml-language-server: $schema=https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/schemas/profiles/cdh.schema.json
cdh_schema_version: v0.5.0
extensions:
- https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/cdh/schema.json
- https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/agriculture/schema.json
id: hfcp-nigeria-prices
version: '1'
title: High-Frequency Crowdsourced Commodity Prices in Nigeria (HFCP)
description: Crowdsourced, high-frequency retail, wholesale and farmgate food-commodity prices across all 36 states and the
  Federal Capital Territory of Nigeria, curated with the National Bureau of Statistics. Prices were collected daily from markets
  and carry location metadata, enabling analysis of price dynamics, food security and market integration.
license: CC-BY-4.0
resource_type: dataset
access: public
created: '2026-10-28'
updated: '2026-11-03'
keywords:
- food prices
- market
- crowdsourcing
- food security
contact:
- organization: World Bank Group
  name: Julius Adewopo
  email: jadewopo@worldbank.org
  roles:
  - licensor
  - producer
- organization: World Bank Group
  name: Bo Pieter Johannes Andree
  email: bandree@worldbank.org
  roles:
  - maintainer
citation:
  title: Nigeria High-Frequency Commodity Prices (HFCP)
  authors:
  - organization: World Bank Group
  date: '2025'
  publisher: World Bank Microdata Library
doi: 10.48529/tgmq-wv80
spatial:
  geography:
  - nigeria
temporal:
  start_date: 2024-12
  end_date: 2025-06
  update_frequency: daily
structures:
- name: prices
  dimensions:
  - name: market
    type: location
    data_type: string
    description: Market and sub-national (Admin 1) location of the price observation.
  - name: product
    type: commodity
    data_type: string
    description: Commodity tracked (yam, white maize, garri, rice, sorghum, beans, soybeans).
  - name: date
    type: temporal
    data_type: date
    description: Date of the daily price observation.
  variables:
  - name: price
    description: Observed commodity price at the market on that date.
    data_type: number
    unit: NGN
cdh:
  domain:
  - socioeconomic
  - agricultural-production
commodities:
- yams
- maize
- cassava
- rice
- sorghum
- beans
- soya-beans
data:
- name: hfcp-catalog
  description: World Bank Microdata Library record with the 11 pre-processed daily price files (level2_price_*).
  locations:
  - url: https://microdata.worldbank.org/index.php/catalog/8197
  media_type: text/html
