spatial:
  bbox: [-170.0013, -59.9871, 179.9696, 80.0013]
  crs: EPSG:4326
  geography: [world]

structures:
  - name: depth
    dimensions:
      - &cell
        name: cell
        type: xy
        description: 3 arc-seconds (~90 m at the equator).
        step: 0.000833333
        unit: degree
      - &return_period
        name: return_period
        type: return-period
        description: Flood recurrence interval in years.
        values: [10, 20, 50, 75, 100, 200, 500]
        unit: year
    variables:
      - &depth
        name: depth
        description: Modelled flood water depth. 0 means not flooded at that return period.
        data_type: float32
        unit: m
        nodata: -9999
  - name: depth-nan
    dimensions: [*cell, *return_period]
    variables:
      - <<: *depth
        nodata: "NaN"
  - name: hazard
    dimensions: [*cell, *return_period]
    variables:
      - name: hazard
        description: >
          Water depth class, consistent with the GloFAS "Flood hazard 100-year return period" static
          layer without its permanent-water class.
        data_type: uint8
        nodata: 255
        categories:
          - value: 0
            label: not flooded
          - value: 1
            label: under 1 m
          - value: 2
            label: 1 to 3 m
          - value: 3
            label: 3 to 10 m
          - value: 4
            label: over 10 m
  - name: permanent-water
    dimensions: [*cell]
    variables:
      - name: permanent_water
        description: Permanent water bodies used to patch the flood hazard maps.
        data_type: uint8
        nodata: 255
        categories:
          - value: 0
            label: land
          - value: 1
            label: permanent water
  - name: spurious-depths
    dimensions: [*cell]
    variables:
      - name: spurious_depths
        description: >
          Areas where modelled depth exceeds 10 m in channels draining under 3,000 km2 at the
          10-year return period, plus a 2 km buffer.
        data_type: uint8
        nodata: 255
        categories:
          - value: 0
            label: reliable
          - value: 1
            label: spurious depth

cdh:
  domain: [hydrology]
  usage:
    intended_uses:
      - flood-prone baseline by magnitude for exposure and risk assessment
      - population, cropland and infrastructure exposure to river flooding at a given return period
      - modelled counterpart to observed flood extents from satellite monitoring
    not_recommended_for:
      - use: reading it as observed or future-scenario flooding
        reason: static return-period hazard from a historical reanalysis, with no dates or scenarios.
        use_instead: satellite flood extent products, such as Copernicus Global Flood Monitoring, for what actually flooded and when.
      - use: coastal, pluvial or flash flooding
        reason: only riverine inundation along the modelled river network is simulated.
      - use: depth values inside the spurious-depths mask
        reason: known model over-prediction in small channels.
        use_instead: treat masked cells as flood-prone with unknown depth, or use the hazard class.

processing:
  - id: source
    description: >
      River flows from LISFLOOD driven by the GloFAS v4.0 hydrological reanalysis, inundation from
      LISFLOOD-FP on a MERIT-DEM and MERIT-Hydro base, published by JRC as 271 GeoTIFF tiles per
      layer.
    derived_from:
      - title: JRC Data Store, CEMS-GLOFAS flood hazard
        url: https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/CEMS-GLOFAS/flood_hazard/
        version: "2.1.2"
      - title: GloFAS hydrological reanalysis
        url: http://data.europa.eu/89h/f96b7a19-0133-4105-a879-0536991ca9c5
        version: "4.0"
  - id: cloud-optimize
    description: >
      Tiles converted to cloud-optimized GeoTIFFs with internal overviews and published on Source
      Cooperative as one STAC collection per layer, by Nissim Lebovits (Radiant Earth).
  - id: index
    description: >
      Upstream STAC collections snapshotted to STAC GeoParquet, one file per collection, and
      mosaicked into VRTs that reference the Source Cooperative tiles in place. depth.vrt and
      hazard.vrt stack the return periods as bands. No data is copied.
    code:
      url: https://github.com/CGIAR-Climate-Data-Hub/cdh-data-pipeline/blob/main/recipes/jrc_glofas.py
      version: 78a2982
    date: "2026-09-29"
  - id: crop-cog
    description: Depth tiles cropped to a Kenya window and written as one COG per return period.

data:
  - name: depth
    structures: [depth]
    description: >
      Flood depth tiles, one Source Cooperative collection per return period (depth-rp10 ...
      depth-rp500). Open the VRT for a single seven-band mosaic, bands in return-period order and
      described rp10 to rp500, or a GeoParquet file to list and query the tiles of one return period.
    locations:
      - url: https://data.source.coop/nlebovits/jrc-glofas/
        title: HTTPS
    media_type: image/tiff; application=geotiff; profile=cloud-optimized
    processing_steps: [source, cloud-optimize]
    file_index:
      - format: vrt
        title: Seven bands, rp10 to rp500; tile paths are HTTPS (/vsicurl), band sources are sibling depth-rp{n}.vrt files
        locations:
          - url: https://digital-atlas.s3.amazonaws.com/cdh/data/jrc-glofas-v2.1.2/depth.vrt
            title: HTTPS
          - url: s3://digital-atlas/cdh/data/jrc-glofas-v2.1.2/depth.vrt
            title: S3
