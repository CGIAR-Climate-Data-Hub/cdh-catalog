# somewhat double-federated record - the COG copies from JRC live on Source Cooperative; the Hub publishes only index files
# (VRT mosaics and STAC GeoParquet) that open them in place.
cdh_schema_version: v0.4.1
extensions:
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.4.1/extensions/cdh/schema.json

id: jrc-glofas
title: JRC global river flood hazard maps (CEMS-GloFAS)
version: "2.1.2"
description: >
  Modelled riverine flood inundation along the global river network for seven return periods, 10 to
  500 years, at 3 arc-seconds (~90 m), from the European Commission Joint Research Centre (JRC) for
  the Copernicus Emergency Management Service (CEMS). River flows come from the LISFLOOD
  hydrological model driven by the Global Flood Awareness System (GloFAS) v4.0 reanalysis;
  inundation is simulated with the LISFLOOD-FP hydraulic model. Each return period has a water-depth
  map in metres and a hazard map of four depth classes plus not flooded, with two auxiliary masks:
  permanent water bodies used to patch the maps, and spurious depths where the model is known to
  over-predict. Source Cooperative serves the maps as cloud-optimized GeoTIFF tiles, and the Hub
  publishes GDAL virtual raster (VRT) mosaics with one band per return period and STAC GeoParquet
  indexes that open those tiles in place.
resource_type: dataset
license: CC-BY-4.0
attribution: Contains modified Copernicus Emergency Management Service information [year]

keywords:
  - flood
  - river flood
  - flood hazard
  - GloFAS
  - JRC
  - Copernicus
  - CEMS

note: >
  Static modelled hazard with no temporal coverage; only land is covered. Very high depths can be
  artefacts of the hydraulic model, the 90 m resolution, sinks in the elevation model or tile boundaries, and the
  spurious-depths mask flags only the known cases. The VRTs reference the tiles over HTTPS with
  GDAL's /vsicurl, so open them with GDAL-based tools (rasterio, terra) rather than downloading
  the .vrt alone, and read a window or a few tiles at a time: every read touches Source
  Cooperative directly, so visualising or reading the whole mosaic issues thousands of requests
  and is very slow.

