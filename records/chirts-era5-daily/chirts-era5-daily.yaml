id: chirts-era5-daily
title: CHIRTS-ERA5 Daily
version: "1"
description: >-
  CHIRTS-ERA5 daily provides global, high-resolution (0.05°) daily maximum and minimum 2-meter air
  temperature estimates from 1980 to present. It blends ERA5 reanalysis with station observations
  using the CHIRTS algorithm, producing a consistent long-term record suitable for climate trend
  analysis, heat-stress monitoring, and agricultural modeling. The primary access is an
  analysis-ready Zarr store for bounding-box and time-range reads; the source daily GeoTIFFs from
  the Climate Hazards Center are the alternative.
resource_type: dataset
