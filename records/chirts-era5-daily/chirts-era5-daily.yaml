id: chirts-era5-daily
title: CHIRTS-ERA5 Daily
version: "1"
description: >-
  CHIRTS-ERA5 daily provides global, high-resolution (0.05°) daily maximum and minimum 2-meter air
  temperature estimates from 1983 to present. It blends ERA5 reanalysis with station observations
  using the CHIRTS algorithm, producing a consistent long-term record suitable for climate trend
  analysis, heat-stress monitoring, and agricultural modeling.
resource_type: dataset
keywords:
  - temperature
  - CHIRTS
  - ERA5
  - station-blended
  - heat stress
