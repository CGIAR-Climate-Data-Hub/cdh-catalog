spatial:
  bbox:
    - -180
    - -60
    - 180
    - 70
  crs: EPSG:4326
  geography:
    - world
temporal:
  start_date: "1983-01-01"
  end_date: null
  update_frequency: daily
# Tmax and Tmin are separate file sets, so each is its own structure on the shared grid and axis.
structures:
  - name: tmax
    dimensions:
      - &cell
        name: cell
        type: xy
        description: 0.05° (~5 km at equator).
        step: 0.05
        unit: degree
      - &time
        name: time
        type: temporal
        description: Day of the temperature estimate; the {time} token of the daily files.
        extent: ["1983-01-01", "2026-10-03"] # files present as of `updated`; may lag the data, never lead it
        step: P1D
    variables:
      - name: Tmax
        description: Daily maximum 2-meter air temperature
        data_type: float32
        unit: degC
        nodata: -9999
  - name: tmin
    dimensions: [*cell, *time]
    variables:
      - name: Tmin
        description: Daily minimum 2-meter air temperature
        data_type: float32
        unit: degC
        nodata: -9999
data:
  - name: tmax-geotiffs
    structures: [tmax]
    locations:
      - url: https://data.chc.ucsb.edu/experimental/CHIRTS-ERA5/tmax/tifs/daily/
        title: HTTPS
    href_template: "{time:%Y}/CHIRTS-ERA5.daily_Tmax.{time:%Y.%m.%d}.tif"
    description: Daily maximum temperature GeoTIFF files, one per day in yearly folders
    media_type: image/tiff; application=geotiff
  - name: tmin-geotiffs
    structures: [tmin]
    locations:
      - url: https://data.chc.ucsb.edu/experimental/CHIRTS-ERA5/tmin/tifs/daily/
        title: HTTPS
    href_template: "{time:%Y}/CHIRTS-ERA5.daily_Tmin.{time:%Y.%m.%d}.tif"
    description: Daily minimum temperature GeoTIFF files, one per day in yearly folders
    media_type: image/tiff; application=geotiff
cdh:
  domain:
    - climate
  usage:
    intended_uses:
      - daily temperature inputs for crop models and heat-stress indicators
      - long-term temperature trends and extremes at 0.05°
    not_recommended_for:
      - use: hourly or sub-daily analysis
        reason: only daily maximum and minimum are published.
        use_instead: ERA5 hourly 2 m temperature.
