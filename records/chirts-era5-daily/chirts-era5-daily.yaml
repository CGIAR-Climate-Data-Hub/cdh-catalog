spatial:
  bbox:
    - -180
    - -60
    - 180
    - 70
  crs: EPSG:4326
  geography:
    - world
temporal:
  start_date: "1980-01-01"
  end_date: null
  update_frequency: daily

structures:
  # One GeoTIFF per day and variable; float32 with -9999 nodata.
  - name: tmax
    dimensions:
      - &cell
        name: cell
        type: xy
        description: 0.05° (~5 km at equator), 60 S to 70 N.
        step: 0.05
        unit: degree
      - &time
        name: time
        type: temporal
        description: Day; the {time} token of the daily files.
        extent: ["1980-01-01", "2026-10-21"] # files present as of `updated`; may lag the data, never lead it
        step: P1D
    variables:
      - &Tmax
        name: Tmax
        description: Daily maximum 2-meter air temperature
        data_type: float32
        unit: degC
        nodata: -9999
  - name: tmin
    dimensions: [*cell, *time]
    variables:
      - &Tmin
        name: Tmin
        description: Daily minimum 2-meter air temperature
        data_type: float32
        unit: degC
        nodata: -9999

  # Both variables in one store, packed as int16 with a 0.1 scale factor.
  - name: zarr
    dimensions:
      - *cell
      - <<: *time
        description: Day. lat runs north to south.
        extent: ["1981-01-01", "2026-10-21"] # as of `updated`
    variables:
      - <<: *Tmax
        data_type: int16
        nodata: -32768
        note: Stored as int16 with scale_factor 0.1; xarray rescales, GDAL returns raw counts.
      - <<: *Tmin
        data_type: int16
        nodata: -32768
        note: Stored as int16 with scale_factor 0.1; xarray rescales, GDAL returns raw counts.

processing:
  - id: source
    description: CHIRTS-ERA5 daily GeoTIFFs published by the Climate Hazards Center.
    derived_from:
      - url: https://data.chc.ucsb.edu/experimental/CHIRTS-ERA5/
        title: CHIRTS-ERA5 daily
  - id: cloud-optimize
    description: Stack the daily GeoTIFFs into one Tmax/Tmin(time, lat, lon) Zarr v3 store, packed as int16.
    date: "2026-10-08"

data:
  - name: tmax-geotiffs
    structures: [tmax]
    locations:
      - url: https://data.chc.ucsb.edu/experimental/CHIRTS-ERA5/tmax/tifs/daily/
        title: HTTPS
    href_template: "{time:%Y}/CHIRTS-ERA5.daily_Tmax.{time:%Y.%m.%d}.tif"
    description: Daily maximum temperature GeoTIFF files, one per day in yearly folders
    media_type: image/tiff; application=geotiff
    processing_steps: [source]
  - name: tmin-geotiffs
    structures: [tmin]
    locations:
      - url: https://data.chc.ucsb.edu/experimental/CHIRTS-ERA5/tmin/tifs/daily/
        title: HTTPS
    href_template: "{time:%Y}/CHIRTS-ERA5.daily_Tmin.{time:%Y.%m.%d}.tif"
    description: Daily minimum temperature GeoTIFF files, one per day in yearly folders
    media_type: image/tiff; application=geotiff
    processing_steps: [source]
  - name: zarr-geo-chunked
    structures: [zarr]
    locations:
      - url: https://huggingface.co/datasets/aaguilar90/chirts-era5-daily/resolve/main/chirts-era5-daily.zarr
        title: HTTPS
    description: >
      Zarr v3 store chunked 128 days x 300 lat x 300 lon (about 4 months x 15° x 15° per chunk),
      for bounding-box and time-range reads without downloading the whole dataset.
    media_type: application/vnd.zarr; version=3
    file_size: 118 GB
    processing_steps: [source, cloud-optimize]

cdh:
  domain:
    - climate
  usage:
    intended_uses:
      - daily temperature inputs for crop models and heat-stress indicators
      - long-term temperature trends and extremes at 0.05°
    not_recommended_for:
      - use: hourly or sub-daily analysis
        reason: only daily maximum and minimum are published.
        use_instead: ERA5 hourly 2 m temperature.

additional_links:
