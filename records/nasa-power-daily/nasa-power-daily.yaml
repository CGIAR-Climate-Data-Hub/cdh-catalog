      - name: SRF_ALB_ADJ
        description: The ratio of the solar energy reflected by the surface of the earth compared to the total solar energy incident reaching the surface of the earth.
        data_type: float32
        unit: "1"
        nodata: NaN
      - name: TOA_SW_DNI
        description: The total solar irradiance incident (direct plus diffuse) on a horizontal plane where oriented to the sun's position at the top of the atmosphere (extraterrestrial radiation).
        data_type: float32
        unit: W m-2
        nodata: NaN
      - name: TOA_SW_DWN
        description: The total solar irradiance incident (direct plus diffuse) on a horizontal plane at the top of the atmosphere (extraterrestrial radiation).
        data_type: float32
        unit: W m-2
        nodata: NaN
      - name: TS_ADJ
        description: The adjusted average temperature at the earth's surface.
        data_type: float32
        unit: degC
        nodata: NaN

  - name: flashflux
    dimensions: [*cell_1deg, *time_lst]
    variables:
      - name: ALLSKY_SFC_LW_DWN
        description: The downward thermal infrared irradiance under all sky conditions reaching a horizontal plane at the surface of the earth.
        data_type: float32
        unit: W m-2
        nodata: NaN
      - name: ALLSKY_SFC_SW_DWN
        description: The total solar irradiance incident (direct plus diffuse) on a horizontal plane at the surface of the earth under all sky conditions.
        data_type: float32
        unit: W m-2
        nodata: NaN
      - name: CLRSKY_SFC_LW_DWN
        description: The downward thermal infrared irradiance under clear sky conditions reaching a horizontal plane on the surface of the earth.
        data_type: float32
        unit: W m-2
        nodata: NaN
      - name: CLRSKY_SFC_SW_DWN
        description: The total solar irradiance incident (direct plus diffuse) on a horizontal plane at the surface of the earth under clear sky conditions.
        data_type: float32
        unit: W m-2
        nodata: NaN
      - name: TOA_SW_DWN
        description: The total solar irradiance incident (direct plus diffuse) on a horizontal plane at the top of the atmosphere (extraterrestrial radiation).
        data_type: float32
        unit: W m-2
        nodata: NaN

  - name: imerg
    dimensions:
      - name: cell
        type: xy
        description: 0.1° (~11 km at equator). Cell centres at -89.95 to 89.95 and -179.95 to 179.95.
        step: 0.1
        unit: degree
      - name: time
        type: temporal
        description: >
          Day, midnight to midnight UTC. IMERG has no local-time version. The axis is allocated to
          2029-12-31; days past the last available date are all NaN.
        step: P1D
    variables:
      - name: IMERG_PRECLIQUID_PROB
        description: 'Probability of liquid precipitation estimated with a diagnostic parameterization using ancillary data. POWER marks it "reviewing": not yet an official product.'
        data_type: float32
        unit: "%"
        nodata: NaN
      - name: IMERG_PRECTOT
        description: 'The average IMERG total precipitation at the surface of the earth. POWER marks it "reviewing": not yet an official product.'
        data_type: float32
        unit: mm d-1
        nodata: NaN
      - name: IMERG_PRECTOT_COUNT
        description: 'The count of half-hourly precipitation retrievals where precipitation is at least 0.01 mm. POWER marks it "reviewing": not yet an official product.'
        data_type: int16
        unit: "1"
        nodata: -999

cdh:
  domain: [climate]
  usage:
    intended_uses:
      - daily weather inputs for crop, livestock and agro-ecological models where no local station exists
      - solar radiation and evapotranspiration inputs that station networks rarely measure
      - weather time series for trial sites, farms and other point locations, 1981 to a few days ago
      - growing-season summaries such as heat days, rainfall totals and degree days
    not_recommended_for:
      - use: rainfall totals at a site or for a small catchment
        reason: MERRA-2 precipitation is a 55 km model estimate; IMERG is better but still satellite-only.
        use_instead: CHIRPS v3 daily (station-blended), or IMERG from this record for recent days.
      - use: hourly or sub-daily analysis
        reason: this record covers the daily stores; the hourly stores are a separate product with fewer variables and different units.
        use_instead: the POWER hourly API or the power_*_hourly_* stores in the same bucket.
      - use: long-term trends across the MERRA-2 to GEOS-IT join
        reason: the two models differ; a step at the join can look like a trend.
        use_instead: MERRA-2 alone, accepting the lag of about a month.

processing:
  - id: source
    description: >
      POWER release 10 regrids nothing: each source is kept at its native grid and aggregated from
      hourly to local-solar-time or UTC days by the POWER team at NASA Langley, then written to
      Zarr on AWS Open Data and served through the POWER API.
    derived_from:
      - title: MERRA-2 (Modern-Era Retrospective analysis for Research and Applications, version 2)
        url: https://gmao.gsfc.nasa.gov/reanalysis/MERRA-2/
      - title: GEOS-IT (Goddard Earth Observing System for Instrument Teams)
        url: https://gmao.gsfc.nasa.gov/gmao-products/geos-it/
      - title: CERES SYN1deg
        url: https://ceres.larc.nasa.gov/data/#syn1deg-level-3
      - title: CERES FLASHFlux
        url: https://ceres.larc.nasa.gov/data/#flashflux-level-3
      - title: GPM IMERG
        url: https://gpm.nasa.gov/data/imerg

# Store names follow power_{source}_daily_{temporal|spatial}_{lst|utc}.zarr. "temporal" chunks
# are long in time and small in space (time series at points); "spatial" chunks are one day of
# the whole grid (maps). Anonymous access; Zarr v2 with consolidated metadata.
data:
  - name: merra2-temporal
    structures: [merra2]
    description: >
      Primary meteorology, 1981 to about a month ago. Chunked 5844 days x 15 lat x 15 lon (16 years
      x 7.5° x 9.4°), so decades at a few points read few chunks. Slow for a map on one day.
    locations:
      - url: https://nasa-power.s3.us-west-2.amazonaws.com/merra2/temporal/power_merra2_daily_temporal_lst.zarr
        title: S3 (us-west-2), LST
    media_type: application/vnd.zarr; version=2
    processing_steps: [source]
  - name: merra2-spatial
    structures: [merra2]
    description: Same data chunked one day x whole grid, for maps of a region or the globe on a few days.
    locations:
      - url: https://nasa-power.s3.us-west-2.amazonaws.com/merra2/spatial/power_merra2_daily_spatial_lst.zarr
        title: S3 (us-west-2), LST
    media_type: application/vnd.zarr; version=2
    processing_steps: [source]
  - name: geosit-temporal
    structures: [geosit]
    description: >
      Near-real-time meteorology, 2022 to a few days ago, on the MERRA-2 grid. Use it for the weeks
      MERRA-2 has not yet covered. Chunked 1473 days x 15 lat x 15 lon.
    locations:
      - url: https://nasa-power.s3.us-west-2.amazonaws.com/geosit/temporal/power_geosit_daily_temporal_lst.zarr
        title: S3 (us-west-2), LST
    media_type: application/vnd.zarr; version=2
    processing_steps: [source]
  - name: geosit-spatial
    structures: [geosit]
    description: GEOS-IT chunked one day x whole grid, for maps.
    locations:
      - url: https://nasa-power.s3.us-west-2.amazonaws.com/geosit/spatial/power_geosit_daily_spatial_lst.zarr
        title: S3 (us-west-2), LST
    media_type: application/vnd.zarr; version=2
    processing_steps: [source]
  - name: syn1deg-temporal
    structures: [syn1deg]
    description: >
      Primary solar and longwave radiation, 2001 to about three months ago, 1° grid. Chunked 4000
      days x 10 lat x 15 lon.
    locations:
      - url: https://nasa-power.s3.us-west-2.amazonaws.com/syn1deg/temporal/power_syn1deg_daily_temporal_lst.zarr
        title: S3 (us-west-2), LST
    media_type: application/vnd.zarr; version=2
    processing_steps: [source]
  - name: syn1deg-spatial
    structures: [syn1deg]
    description: SYN1deg chunked one day x whole grid, for maps.
    locations:
      - url: https://nasa-power.s3.us-west-2.amazonaws.com/syn1deg/spatial/power_syn1deg_daily_spatial_lst.zarr
        title: S3 (us-west-2), LST
    media_type: application/vnd.zarr; version=2
    processing_steps: [source]
  - name: flashflux-temporal
    structures: [flashflux]
    description: >
      Near-real-time radiation, 2024 to a few days ago, on the SYN1deg grid but only the five core
      fluxes. Use it for the months SYN1deg has not yet covered. Chunked 1473 days x 15 x 15.
    locations:
      - url: https://nasa-power.s3.us-west-2.amazonaws.com/flashflux/temporal/power_flashflux_daily_temporal_lst.zarr
        title: S3 (us-west-2), LST
    media_type: application/vnd.zarr; version=2
    processing_steps: [source]
  - name: flashflux-spatial
    structures: [flashflux]
    description: FLASHFlux chunked one day x whole grid, for maps.
    locations:
      - url: https://nasa-power.s3.us-west-2.amazonaws.com/flashflux/spatial/power_flashflux_daily_spatial_lst.zarr
        title: S3 (us-west-2), LST
    media_type: application/vnd.zarr; version=2
    processing_steps: [source]
  - name: imerg-temporal
    structures: [imerg]
    description: >
      Satellite precipitation, 1998 to a few days ago, 0.1° grid, UTC days only. POWER still marks
      the IMERG variables "reviewing", not official. Chunked 1461 days x 50 lat x 100 lon (4 years
      x 5° x 10°).
    locations:
      - url: https://nasa-power.s3.us-west-2.amazonaws.com/imerg/temporal/power_imerg_daily_temporal_utc.zarr
        title: S3 (us-west-2), UTC
    media_type: application/vnd.zarr; version=2
    processing_steps: [source]
  - name: imerg-spatial
    structures: [imerg]
    description: IMERG chunked one day x 900 lat x 1800 lon (a quarter of the globe), for maps.
    locations:
      - url: https://nasa-power.s3.us-west-2.amazonaws.com/imerg/spatial/power_imerg_daily_spatial_utc.zarr
        title: S3 (us-west-2), UTC
    media_type: application/vnd.zarr; version=2
    processing_steps: [source]
  - name: api-daily
    structures: [merra2, syn1deg, imerg]
    description: >
      Alternative route. One GET returns any of the parameters above for a point or a bounding box
      and date range, already joined across MERRA-2/GEOS-IT and SYN1deg/FLASHFlux (the response
      header lists which sources were used). Pass community=AG for agricultural units (radiation in
      MJ m-2 per day) and time-standard=UTC for IMERG parameters. The regional endpoint takes one
      parameter per request. Needs no key; large regions or many points are slow and
      rate-limited, so use the Zarr stores for those.
    locations:
      - url: https://power.larc.nasa.gov/api/temporal/daily/point?parameters=T2M_MAX,T2M_MIN,PRECTOTCORR,ALLSKY_SFC_SW_DWN&community=AG&latitude=-1.29&longitude=36.82&start=20240101&end=20241231&format=JSON
        title: Point endpoint (example query, Nairobi 2024)
      - url: https://power.larc.nasa.gov/api/temporal/daily/regional?parameters=PRECTOTCORR&community=AG&latitude-min=-5&latitude-max=5&longitude-min=34&longitude-max=42&start=20240101&end=20240107&format=NETCDF
        title: Regional endpoint (example query, one parameter, 8° x 10° box, one week, NetCDF)
    media_type: application/json
    processing_steps: [source]

additional_assets:
