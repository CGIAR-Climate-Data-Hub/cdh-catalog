  - name: syn1deg
    dimensions:
      - &cell_1deg
        name: cell
        type: xy
        description: 1° (~111 km at equator). Cell centres at -89.5 to 89.5 and -179.5 to 179.5.
        step: 1
        unit: degree
      - *time_lst
    variables:
      - name: AIRMASS
        description: Air mass according to Perez et al. 1990.
        data_type: float32
        unit: "1"
        nodata: NaN
      - name: ALLSKY_KT
        description: A fraction representing clearness of the atmosphere; the all sky insolation that is transmitted through the atmosphere to strike the surface of the earth divided by the average of top of the atmosphere total solar irradiance incident.
        data_type: float32
        unit: "1"
        nodata: NaN
      - name: ALLSKY_NKT
        description: The average zenith angle-independent expression of the all sky insolation clearness index.
        data_type: float32
        unit: "1"
        nodata: NaN
      - name: ALLSKY_SFC_LW_DWN
        description: The downward thermal infrared irradiance under all sky conditions reaching a horizontal plane at the surface of the earth.
        data_type: float32
        unit: W m-2
        nodata: NaN
      - name: ALLSKY_SFC_LW_UP
        description: The upward thermal infrared irradiance under all sky conditions.
        data_type: float32
        unit: W m-2
        nodata: NaN
      - name: ALLSKY_SFC_PAR_DIFF
        description: The diffuse (scattered from original direct path by molecules or particles) Photosynthetically Active Radiation (PAR) solar irradiance incident on a horizontal plane at the surface of the earth under all sky conditions.
        data_type: float32
        unit: W m-2
        nodata: NaN
      - name: ALLSKY_SFC_PAR_DIRH
        description: The Photosynthetically Active Radiation (PAR) solar irradiance incident on a horizontal plane at the surface of the earth under all sky conditions.
        data_type: float32
        unit: W m-2
        nodata: NaN
      - name: ALLSKY_SFC_PAR_TOT
        description: The total (direct plus diffuse) Photosynthetically Active Radiation (PAR) incident on a horizontal plane at the surface of the earth under all sky conditions.
        data_type: float32
        unit: W m-2
        nodata: NaN
      - name: ALLSKY_SFC_SW_DIFF
        description: The diffuse (scattered from original direct path by molecules or particles) solar irradiance incident on a horizontal plane at the surface of the earth under all sky conditions.
        data_type: float32
        unit: W m-2
        nodata: NaN
      - name: ALLSKY_SFC_SW_DIRH
        description: The solar irradiance incident on a horizontal plane at the surface of the earth under all sky conditions.
        data_type: float32
        unit: W m-2
        nodata: NaN
      - name: ALLSKY_SFC_SW_DNI
        description: The direct solar irradiance incident to a horizontal plane normal (perpendicular) to the direction of the sun's position under all sky conditions.
        data_type: float32
        unit: W m-2
        nodata: NaN
      - name: ALLSKY_SFC_SW_DWN
        description: The total solar irradiance incident (direct plus diffuse) on a horizontal plane at the surface of the earth under all sky conditions.
        data_type: float32
        unit: W m-2
        nodata: NaN
      - name: ALLSKY_SFC_SW_UP
        description: The upward shortwave irradiance under all sky conditions.
        data_type: float32
        unit: W m-2
        nodata: NaN
      - name: ALLSKY_SFC_UVA
        description: The ultraviolet A (UVA 315nm-400nm) irradiance under all sky conditions.
        data_type: float32
        unit: W m-2
        nodata: NaN
