        data_type: float32
        unit: hPa
        nodata: NaN
      - &TROPQ
        name: TROPQ
        description: The ratio of the mass of water vapor to the total mass of air at the tropopause pressure given by TROPPB.
        data_type: float32
        unit: g kg-1
        nodata: NaN
      - &TROPT
        name: TROPT
