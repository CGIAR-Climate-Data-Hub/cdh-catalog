id: nasa-power-daily
title: NASA POWER daily meteorology, solar radiation and precipitation
version: "10.0.0"
series:
  name: NASA POWER
  url: https://power.larc.nasa.gov/
description: >
  Daily global weather, solar radiation and precipitation for agriculture and energy, 1981 to
  present, from NASA's Prediction Of Worldwide Energy Resources (POWER) project. POWER repackages
  NASA models and satellite products into one analysis-ready, free, no-login service: meteorology
  (temperature, humidity, wind, pressure, soil moisture and temperature, snow) from the MERRA-2
  reanalysis on a 0.5° x 0.625° grid, with GEOS-IT for the last weeks that MERRA-2 has not yet
  covered; solar and longwave radiation from CERES SYN1deg on a 1° grid, with FLASHFlux for the
  most recent days; and satellite precipitation from GPM IMERG on a 0.1° grid. The primary access
  is the set of Zarr stores on AWS Open Data, one per source, each chunked either for time series
  at points or for maps. The POWER API is the alternative: it stitches the sources into one series
  per parameter for a point or a small region, in JSON, CSV or NetCDF.
resource_type: dataset
license: CC-BY-4.0
attribution: >
  These data were obtained from the National Aeronautics and Space Administration (NASA) Langley
  Research Center (LaRC) Prediction of Worldwide Energy Resource (POWER) Project funded through the
  NASA Earth Science/Applied Science Program.

access: public

keywords:
  - NASA POWER
  - MERRA-2
  - GEOS-IT
  - CERES
  - IMERG
  - reanalysis
  - daily weather
  - solar radiation
  - agrometeorology
  - crop modelling
  - analysis-ready
  - zarr

note: >
  Each source is its own Zarr store with its own grid and start date; a series from 1981 to today
  joins MERRA-2 (to about a month ago) with GEOS-IT (2022 to a few days ago), and SYN1deg (to about
  three months ago) with FLASHFlux (2024 to a few days ago). The API does this join for you. Days
  are local solar time (LST) in the stores listed here; every store except IMERG also exists in a
  UTC version with "_utc" in place of "_lst" in the name. Time axes are allocated to 2029-12-31 and
  are NaN past the last available day; check last_available.json in the bucket or slice by date
  rather than trusting the axis end. Units differ between routes: the Zarr stores keep source
  units (radiation in W m-2 daily means, temperature in °C, precipitation in mm per day), while the
  API's AG community returns radiation in MJ m-2 per day and uses -999 for missing. Values are
  model and satellite estimates, not station observations: MERRA-2 cells are about 55 km, so
  expect bias at single sites and in complex terrain, especially for precipitation; prefer IMERG
  or a station-blended product such as CHIRPS for rainfall totals.

