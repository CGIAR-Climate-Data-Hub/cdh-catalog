        nodata: NaN
      - name: ORIGINAL_ALLSKY_SFC_SW_DIRH
        description: The solar irradiance incident on a horizontal plane at the surface of the earth under all sky conditions. Uncorrected source value kept for reference; use the variable without the ORIGINAL_ prefix.
        data_type: float32
