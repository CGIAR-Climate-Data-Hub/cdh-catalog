spatial:
  bbox: [-180.0, -90.0, 180.0, 90.0]
  geography: [world]
  crs: EPSG:4326

temporal:
  start_date: "1981-01-01"
  end_date: null
  update_frequency: daily

# One data dictionary per source. GEOS-IT carries the MERRA-2 variables minus two, so it reuses
# them with merge keys. Units are as stored in the Zarr; the API converts some (see note).
structures:
  - name: merra2
    dimensions:
      - &lat_merra2
        name: lat
        type: y
        description: Latitude of the cell centre, -90 to 90.
        step: 0.5
        unit: degree
      - &lon_merra2
        name: lon
        type: x
        description: Longitude of the cell centre, -180 to 179.375.
        step: 0.625
        unit: degree
      - &time_lst
        name: time
        type: temporal
        description: >
          Day, midnight to midnight local solar time (LST) at the cell. The axis is allocated to
          2029-12-31; days past the last available date are all NaN.
        step: P1D
    variables:
      - &CDD0
        name: CDD0
        description: The daily accumulation of degrees above a 0-degree-Celsius threshold when the daily mean temperature is above the threshold.
        data_type: float32
        unit: degC d
        nodata: NaN
      - &CDD10
        name: CDD10
        description: The daily accumulation of degrees above a 10-degree-Celsius threshold when the daily mean temperature is above the threshold.
        data_type: float32
        unit: degC d
        nodata: NaN
      - &CDD18_3
        name: CDD18_3
        description: The daily accumulation of degrees above an 18.3-degree-Celsius threshold when the daily mean temperature is above the threshold.
        data_type: float32
        unit: degC d
        nodata: NaN
      - &DISPH
        name: DISPH
        description: The height at which the mean velocity is zero due to large obstacles such as buildings/canopy.
        data_type: float32
        unit: m
        nodata: NaN
      - &EVLAND
        name: EVLAND
        description: The evaporation over land at the surface of the earth.
        data_type: float32
        unit: mm d-1
        nodata: NaN
      - &EVPTRNS
        name: EVPTRNS
        description: The evapotranspiration energy flux at the surface of the earth.
        data_type: float32
        unit: W m-2
        nodata: NaN
      - &FROST_DAYS
        name: FROST_DAYS
        description: A frost day occurs when the 2m temperature cools to the dew point temperature and both are less than 0 C or 32 F.
        data_type: float32
        unit: d
        nodata: NaN
      - &FRSEAICE
        name: FRSEAICE
        description: The fraction of ocean covered by sea ice.
        data_type: float32
        unit: "1"
        nodata: NaN
      - &FRSNO
        name: FRSNO
        description: The fraction of land covered by snow.
        data_type: float32
        unit: "1"
        nodata: NaN
      - &GWETPROF
        name: GWETPROF
        description: The amount of water and water vapor present in the soil.
        data_type: float32
        unit: "1"
        nodata: NaN
      - &GWETROOT
        name: GWETROOT
        description: "The amount of water and water vapor available to plants in the root zone, generally considered to be the upper 1 m of soil, expressed as the proportion of water present in a given amount of soil."
        data_type: float32
        unit: "1"
        nodata: NaN
      - &GWETTOP
        name: GWETTOP
        description: The amount of water and water vapor present in the soil.
        data_type: float32
        unit: "1"
        nodata: NaN
      - &HDD0
        name: HDD0
        description: The daily accumulation of degrees below a 0-degree-Celsius threshold when the daily mean temperature is below the threshold.
        data_type: float32
        unit: degC d
        nodata: NaN
      - &HDD10
        name: HDD10
        description: The daily accumulation of degrees below a 10-degree-Celsius threshold when the daily mean temperature is below the threshold.
        data_type: float32
        unit: degC d
        nodata: NaN
      - &HDD18_3
        name: HDD18_3
        description: The daily accumulation of degrees below an 18.3-degree-Celsius threshold when the daily mean temperature is below the threshold.
        data_type: float32
        unit: degC d
        nodata: NaN
      - name: PBLTOP
        description: The pressure at the top of the planet boundary layer.
        data_type: float32
        unit: hPa
        nodata: NaN
      - &PRECSNO
        name: PRECSNO
        description: The snow precipitation at the surface of the earth.
        data_type: float32
        unit: mm d-1
        nodata: NaN
      - name: PRECSNOLAND
        description: The snow precipitation only over land at the surface of the earth.
        data_type: float32
        unit: mm d-1
        nodata: NaN
      - &PRECTOTCORR
        name: PRECTOTCORR
        description: The average MERRA-2 bias corrected total precipitation at the surface of the earth.
        data_type: float32
        unit: mm d-1
        nodata: NaN
      - &PS
        name: PS
        description: The atmospheric pressure at the surface of the earth.
        data_type: float32
        unit: hPa
        nodata: NaN
      - &QV10M
        name: QV10M
        description: The ratio of the mass of water vapor to the total mass of air at 10 meters.
        data_type: float32
        unit: g kg-1
        nodata: NaN
      - &QV2M
        name: QV2M
        description: The ratio of the mass of water vapor to the total mass of air at 2 meters.
        data_type: float32
        unit: g kg-1
        nodata: NaN
      - &RH2M
        name: RH2M
        description: "The ratio of vapor pressure to the saturation vapor pressure with respect to a plane surface of pure water, expressed in percent."
        data_type: float32
        unit: "%"
        nodata: NaN
      - &RHOA
        name: RHOA
        description: The air density at surface of the earth.
        data_type: float32
        unit: kg m-3
        nodata: NaN
      - &SLP
        name: SLP
        description: The sea level pressure at the surface of the earth.
        data_type: float32
        unit: hPa
        nodata: NaN
      - &SNODP
        name: SNODP
        description: The snow depth on land at surface of the earth.
        data_type: float32
        unit: cm
        nodata: NaN
      - &T10M
        name: T10M
        description: The air (dry bulb) temperature at 10 meters above the surface of the earth.
        data_type: float32
        unit: degC
        nodata: NaN
      - &T10M_MAX
        name: T10M_MAX
        description: The maximum hourly air (dry bulb) temperature at 10 meters above the surface of the earth in the period of interest.
        data_type: float32
        unit: degC
        nodata: NaN
      - &T10M_MIN
        name: T10M_MIN
        description: The minimum hourly air (dry bulb) temperature at 10 meters above the surface of the earth in the period of interest.
        data_type: float32
        unit: degC
        nodata: NaN
      - &T10M_RANGE
        name: T10M_RANGE
        description: The minimum and maximum hourly air (dry bulb) temperature range at 10 meters above the surface of the earth in the period of interest.
        data_type: float32
        unit: degC
        nodata: NaN
      - &T2M
        name: T2M
        description: The average air (dry bulb) temperature at 2 meters above the surface of the earth.
        data_type: float32
        unit: degC
        nodata: NaN
      - &T2MDEW
        name: T2MDEW
        description: The dew/frost point temperature at 2 meters above the surface of the earth.
        data_type: float32
        unit: degC
        nodata: NaN
      - &T2MWET
        name: T2MWET
        description: The adiabatic saturation temperature which can be measured by a thermometer covered in a water-soaked cloth over which air is passed at 2 meters above the surface of the earth.
        data_type: float32
        unit: degC
        nodata: NaN
      - &T2M_MAX
        name: T2M_MAX
        description: The maximum hourly air (dry bulb) temperature at 2 meters above the surface of the earth in the period of interest.
        data_type: float32
        unit: degC
        nodata: NaN
      - &T2M_MIN
        name: T2M_MIN
        description: The minimum hourly air (dry bulb) temperature at 2 meters above the surface of the earth in the period of interest.
        data_type: float32
        unit: degC
        nodata: NaN
      - &T2M_RANGE
        name: T2M_RANGE
        description: The difference between the minimum and maximum hourly air (dry bulb) temperature at 2 meters above the surface of the earth in the period of interest.
        data_type: float32
        unit: degC
        nodata: NaN
      - &TO3
        name: TO3
        description: The total amount of ozone in a column extending vertically from the earth's surface to the top of the atmosphere.
        data_type: float32
        unit: DU
        nodata: NaN
      - &TQV
        name: TQV
        description: "The total atmospheric water vapor contained in a vertical column of unit cross-sectional area extending from the surface to the top of the atmosphere, sourced from the GMAO."
        data_type: float32
        unit: kg m-2
        nodata: NaN
      - &TROPPB
        name: TROPPB
