# yaml-language-server: $schema=https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/schemas/profiles/cdh.schema.json
cdh_schema_version: v0.5.0
extensions:
- https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/cdh/schema.json
- https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/agriculture/schema.json
id: harveststat-africa
version: '1.2'
title: HarvestStat Africa - Harmonized Subnational Crop Statistics
description: 'Harmonized subnational agricultural statistics for Sub-Saharan Africa: quantity produced, harvested area and
  yield for 94 crops across 33 countries, mostly 1980-2022, compiled from national and international sources. The release
  pairs a tidy statistics table with FEWS NET-aligned administrative boundaries joinable on a geographic-unit identifier.'
license: CC-BY-NC
resource_type: dataset
access: public
created: '2026-10-28'
updated: '2026-11-03'
keywords:
- crop statistics
- subnational
- yield
- production
- harvest area
contact:
- organization: IFPRI
  name: Liangzhi You
  email: l.you@cgiar.org
  roles:
  - licensor
  - producer
- organization: International Institute of Tropical Agriculture (IITA)
  name: Francis Muthoni
  email: f.muthoni@cgiar.org
  roles:
  - maintainer
citation:
  title: HarvestStat Africa - Harmonized Subnational Crop Statistics for Sub-Saharan Africa
  authors:
  - family: Lee
    given: D.
  - family: Anderson
    given: W.
  - family: You
    given: L.
  - family: Meyer
    given: C.
  date: '2025'
  publisher: Dryad / Scientific Data
doi: 10.5061/dryad.vq83bk42w
related_publications:
- doi: 10.1038/s41597-025-05001-z
spatial:
  bbox:
  - -18.0
  - -35.0
  - 51.0
  - 38.0
  crs: EPSG:4326
  geography:
  - africa
temporal:
  start_date: '1980'
  end_date: '2022'
  update_frequency: annual
structures:
- name: statistics
  dimensions:
  - name: fnid
    type: location
    data_type: string
    description: FEWS NET unique geographic-unit identifier (join key).
  - name: product
    type: commodity
    data_type: string
    description: Crop product name (94 crops).
  - name: planting_year
    type: temporal
    data_type: integer
    description: Year planting begins.
    step: P1Y
    extent:
    - '1980'
    - '2022'
  variables:
  - name: area
    description: Cropped area.
    data_type: number
    unit: ha
  - name: production
    description: Production volume.
    data_type: number
    unit: t
  - name: yield
    description: Yield.
    data_type: number
    unit: t ha-1
  foreign_keys:
  - fields:
    - fnid
    reference:
      resource: harveststat-africa
      asset: boundaries
      fields:
      - fnid
- name: boundaries
  dimensions:
  - name: fnid
    type: location
    data_type: string
    description: FEWS NET geographic-unit identifier of each administrative polygon.
  variables:
  - name: country
    description: Country name of the administrative unit.
    data_type: string
  geometry_column: geometry
cdh:
  domain:
  - agricultural-production
  - socioeconomic
  - boundaries
commodities:
- crops
data:
- name: hvstat-data
  description: Harmonized subnational crop statistics table (hvstat_africa_data_v1.2.csv).
  locations:
  - url: https://datadryad.org/dataset/doi:10.5061/dryad.vq83bk42w
  media_type: text/csv
  structures:
  - statistics
- name: boundaries
  description: FEWS NET-aligned administrative boundaries (hvstat_africa_boundary_v1.2.gpkg).
  locations:
  - url: https://datadryad.org/dataset/doi:10.5061/dryad.vq83bk42w
  media_type: application/geopackage+sqlite3
  structures:
  - boundaries
