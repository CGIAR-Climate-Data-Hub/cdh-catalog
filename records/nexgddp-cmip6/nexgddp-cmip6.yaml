  ""

# Contact Metadata (required). At least one contact MUST list licensor in roles.
contact:
  - name: "" # optional when organization is present; required for person-level contacts
    roles: [licensor] # any of: licensor | producer | processor | point-of-contact | custodian
    email: ""
    organization: "" # required when name is present; may be used on its own
    url: ""
  - name: ""
    roles: []
    email: ""
    organization: ""
    url: ""

# Citation Metadata (citation required unless a doi is provided)
citation:
  title: "" # optional - cite-as title; may differ from the top-level title
  authors: [] # required - names in citation order
  date: "" # required - publication date or year
  publisher: "" # optional - data publisher/repository, or journal for articles
  url: "" # optional
doi: "" # conditional - if doi exists (a doi waives the citation requirement)
related_publications: # optional
  - citation:
      title: ""
      authors: []
      date: ""
      publisher: ""
      url: ""
    doi: "https://doi.org/10.7917/OFSG3345"

# metadata record dates (required) - when this record was written / last changed
created: "2026-09-24"
updated: "2026-09-24"

# Version (required) - the source's own label, or "1" when the source does not version.
# previous_version: the version label this release supersedes (same id); omit on a first release.
version: "v2.0"

# Spatial (conditional - if data has a spatial aspect/will be in STAC)
spatial:
  bbox: [-180.0, -60.0, 180.0, 90.0]
  geography: [world]
  crs: EPSG:4326
  resolution:
    - type: "xy" # one of xy, x, y, point, or polygon
      unit: "degrees"
      value: 0.25
      label: "0.25 degrees (~ 27.75 km)"

temporal:
  start_date: "1950-01-01"
  end_date: "2100-12-31"

# Data fields/Attributes (required)
dimensions:
  - name: "scenario"
    type: scenario
    description: "Socios-economic scenario"
    values: ["historical", "ssp126", "ssp245", "ssp370", "ssp585"]
  - name: "model"
    type: model
    description: "Climate Model"
    values: []
  - name: "date"
    type: temporal
    description: "Date"
    step: p1d

variables:
  - name: ""
    dimensions: []
    # Put the stable definition here. Add the normal reading rule here too when
    # direction matters.
    description: ""
    data_type: ""
    unit: ""
    # Put variable-specific limitations, caveats, or warnings here. Dataset-wide
    # limitations belong in the record-level `note` field.
    note: >
      ""

