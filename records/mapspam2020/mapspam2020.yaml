    email: z.guo@cgiar.org
    organization: International Food Policy Research Institute (IFPRI)
    url: https://www.ifpri.org/
  - name: Shuang Zhou
    roles: [producer]
    email: s.zhou@cgiar.org
    organization: International Food Policy Research Institute (IFPRI)
    url: https://www.ifpri.org/
  - name: Liangzhi You
    roles: [producer]
    organization: International Food Policy Research Institute (IFPRI)

  - organization: International Food Policy Research Institute (IFPRI)
    roles: [licensor]
    url: https://www.ifpri.org/
  - name: Brayden Youngberg
    roles: [maintainer]
    email: b.youngberg@cgiar.org
    organization: Alliance of Bioversity International and CIAT

citation:
  title: Global Spatially-Disaggregated Crop Production Statistics Data for 2020 Version 2.0 Release 2
  authors:
    - organization: International Food Policy Research Institute (IFPRI)
  date: "2026"
  publisher: Harvard Dataverse
doi: 10.7910/DVN/SWPENT
related_publications:
  - citation:
      title: "Generating global crop distribution maps: From census to grid"
      authors:
        - family: You
          given: L.
        - family: Wood
          given: S.
        - family: Wood-Sichra
          given: U.
        - family: Wu
          given: W.
      date: "2014"
      publisher: Agricultural Systems
    doi: 10.1016/j.agsy.2014.01.002

created: "2026-07-06"
updated: "2026-10-08"

spatial:
  bbox: [-180, -90, 180, 90]
  geography:
    - world
  crs: EPSG:4326

temporal:
  date: "2020" # static 2020 reference year (year precision)

structures:
  - name: zarr
    dimensions:
      - &cell
        name: cell
        type: xy
        description: 5 arc-minutes (~10km at equator).
        step: 0.08333333
        unit: degree
      - &crop
        name: crop
        type: crop
        description: MAPSPAM crop code.
        categories:
          - { value: whea, label: Wheat }
          - { value: rice, label: Rice }
          - { value: maiz, label: Maize }
          - { value: barl, label: Barley }
          - { value: mill, label: Small Millet }
          - { value: pmil, label: Pearl Millet }
          - { value: sorg, label: Sorghum }
          - { value: ocer, label: Other Cereals }
          - { value: pota, label: Potato }
          - { value: swpo, label: Sweet Potato }
          - { value: yams, label: Yams }
          - { value: cass, label: Cassava }
          - { value: orts, label: Other Roots }
          - { value: bean, label: Bean }
          - { value: chic, label: Chickpea }
          - { value: cowp, label: Cowpea }
          - { value: pige, label: Pigeon Pea }
          - { value: lent, label: Lentil }
          - { value: opul, label: Other Pulses }
          - { value: soyb, label: Soybean }
          - { value: grou, label: Groundnut }
          - { value: cnut, label: Coconut }
          - { value: oilp, label: Oilpalm }
          - { value: sunf, label: Sunflower }
          - { value: rape, label: Rapeseed }
          - { value: sesa, label: Sesame Seed }
          - { value: ooil, label: Other Oil Crops }
          - { value: sugc, label: Sugarcane }
          - { value: sugb, label: Sugarbeet }
          - { value: cott, label: Cotton }
          - { value: ofib, label: Other Fibre Crops }
          - { value: coff, label: Arabic Coffee }
          - { value: rcof, label: Robusta Coffee }
          - { value: coco, label: Cocoa }
          - { value: teas, label: Tea }
          - { value: toba, label: Tobacco }
          - { value: bana, label: Banana }
          - { value: plnt, label: Plantain }
          - { value: citr, label: Citrus }
          - { value: trof, label: Other Tropical Fruit }
          - { value: temf, label: Temperate Fruit }
          - { value: toma, label: Tomato }
          - { value: onio, label: Onion }
          - { value: vege, label: Other Vegetables }
          - { value: rubb, label: Rubber }
          - { value: rest, label: Rest of Crops }

      - &technology
        name: technology
        type: technology
        description: MAPSPAM production system; all is the sum of irrigated and rainfed.
        values: [all, irrigated, rainfed]
    variables:
      - &physical_area
        name: physical_area
        nodata: "NaN"
        description: Physical crop area allocated to each grid cell.
        data_type: float32
        unit: ha
      - &harvested_area
        name: harvested_area
        nodata: "NaN"
        description: Harvested crop area allocated to each grid cell.
        data_type: float32
        unit: ha
      - &production
        name: production
        nodata: "NaN"
        description: Crop production allocated to each grid cell.
        data_type: float32
        unit: t
        note: Absolute quantity; regional summaries should sum values across cells.
      - &yield
        name: yield
        nodata: "NaN"
        description: Crop yield for each grid cell.
        data_type: float32
        unit: kg ha-1
        note: >
          Relative quantity; do not sum yield values across grid cells. Regional summaries should
          use a weighted mean with harvested_area as the weight.

  # Same variables as the Zarr, stored with the float32 minimum as fill value.
  - name: cogs
    dimensions: [*cell, *crop, *technology]
    variables:
      - { <<: *physical_area, nodata: -3.4028235e+38 }
      - { <<: *harvested_area, nodata: -3.4028235e+38 }
      - { <<: *production, nodata: -3.4028235e+38 }
      - { <<: *yield, nodata: -3.4028235e+38 }

cdh:
  domain: [agricultural-production]
  usage:
    intended_uses:
      - global and regional analysis of crop area, production, and yield patterns
      - food security and agricultural systems assessment
      - spatial targeting at national and sub-national scale
    not_recommended_for:
      - use: field-scale farm management
        reason: the grid is too coarse for field-scale operational decisions.
        use_instead: local survey or administrative production data.

