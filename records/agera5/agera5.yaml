# yaml-language-server: $schema=https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.4.1/schemas/profiles/cdh.schema.bundled.json
# FEDERATED record - ECMWF serves the data; the Hub does not host a copy.
cdh_schema_version: v0.4.1
extensions:
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.4.1/extensions/cdh/schema.json
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.4.1/extensions/climate/schema.json

id: agera5
title: AgERA5 daily agrometeorological indicators
version: "2.0"
description: >
  Daily surface weather for agriculture, 1979 to present, on a global 0.1° grid. AgERA5
  aggregates the hourly ECMWF ERA5 reanalysis to local-time days and corrects it to the finer
  topography, land use and coastlines of ECMWF's 0.1° HRES model. Its 27 variables (air and dew
  point temperature, precipitation, solar radiation, humidity, vapour pressure, wind, cloud cover,
  snow, FAO-56 reference evapotranspiration) match the inputs of most crop and agro-ecological
  models. The primary access is ECMWF's two analysis-ready Zarr stores, one chunked for time series
  at points and one for maps of a region; a Google Earth Engine copy and the CDS API are
  alternatives.
resource_type: dataset
license: CC-BY-4.0
attribution: Generated using Copernicus Climate Change Service information [year].

access: restricted
access_note: >
  Free, but every route needs an account. The Zarr stores and the CDS API take a Copernicus
  Climate Data Store (CDS) Personal Access Token: register at https://cds.climate.copernicus.eu,
  copy the token from your profile page, then open the dataset page, go to the Download tab and
  accept the dataset licence at the bottom. Until the licence is accepted the stores answer 401 or
  403 even with a valid token. Send the token as an HTTP header "Authorization: Bearer <token>";
  example.py beside this record is a working call. The Earth Engine asset needs a Google Earth
  Engine account.

keywords:
  - AgERA5
  - ERA5
  - reanalysis
  - daily weather
  - agrometeorology
  - crop modelling
  - evapotranspiration
  - analysis-ready
  - zarr

note: >
  Each day runs midnight to midnight local time at the grid cell, not UTC. Temperatures are
  kelvin and solar radiation is J m-2 d-1; convert as needed. The time axis trails real time by
  about a week. Values are reanalysis, not station observations: expect bias at single sites,
  especially for precipitation in mountains.

