# yaml-language-server: $schema=https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/schemas/profiles/cdh.schema.json
cdh_schema_version: v0.5.0
extensions:
- https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/cdh/schema.json
- https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/agriculture/schema.json
id: carob
version: '1'
title: Carob - Standardized Agricultural Experiment and Survey Data
description: Carob aggregates and standardizes open agricultural research data from experiments and surveys into reproducible,
  tidy datasets produced with R workflows. The compiled observations span 1950-2025 and cover crop performance across many
  sites, and can be linked to global or regional climate products to study observation-climate relationships.
license: CC-BY-4.0
resource_type: dataset
access: public
created: '2026-10-28'
updated: '2026-10-28'
keywords:
- field experiments
- crop trials
- standardization
- meta-analysis
- agronomy
contact:
- organization: UC Davis and CGIAR Sustainable Farming Program
  name: Eduardo Garcia Bendito
  email: e.bendito@cgiar.org
  roles:
  - licensor
  - producer
- organization: Carob project
  name: Eduardo Garcia Bendito
  email: e.bendito@cgiar.org
  roles:
  - maintainer
citation:
  title: 'Carob: standardizing agricultural research data'
  authors:
  - organization: Carob project (UC Davis / CGIAR SFP)
  date: '2025'
  publisher: Carob
  url: https://carob-data.org
spatial:
  bbox:
  - -180
  - -90
  - 180
  - 90
  crs: EPSG:4326
  geography:
  - world
temporal:
  start_date: '1950'
  end_date: '2025'
  update_frequency: irregular
structures:
- name: observations
  dimensions:
  - name: location
    type: location
    data_type: string
    description: Site of the experiment or survey (country and coordinates).
  - name: date
    type: temporal
    data_type: date
    description: Observation or harvest date of the record.
  variables:
  - name: yield
    description: Reported crop yield of the observation.
    data_type: number
    unit: t ha-1
cdh:
  domain:
  - agricultural-production
commodities:
- cassava
- maize
data:
- name: carob-portal
  description: Carob site providing access to the standardized open agricultural datasets (CC-licensed).
  locations:
  - url: https://carob-data.org/
  media_type: text/html
