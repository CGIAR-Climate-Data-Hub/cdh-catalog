# yaml-language-server: $schema=https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.4.1/schemas/profiles/cdh.schema.bundled.json
# SPEI at 3- and 12-month scales computed by the Adaptation Atlas from CHIRPS v3 and CHIRTS-ERA5.
cdh_schema_version: v0.4.1
extensions:
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.4.1/extensions/cdh/schema.json
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.4.1/extensions/climate/schema.json

id: africa-spei-drought
title: 3- and 12-month SPEI from CHIRPS v3 and CHIRTS-ERA5 (Africa)
version: "1"
series:
  name: Africa Agriculture Adaptation Atlas
  url: https://adaptationatlas.cgiar.org/
description: >
  Standardized Precipitation-Evapotranspiration Index (SPEI) at 3-month and 12-month accumulation,
  as per-pixel monthly Cloud Optimized GeoTIFFs over Africa, 1981 to present. The index is computed
  from the climatic water balance (CHIRPS v3 precipitation minus Hargreaves potential
  evapotranspiration from CHIRTS-ERA5 temperature) on the 0.05° CHIRPS grid, fitted to a
  log-logistic distribution over the 1991-2020 reference period. SPEI-03 tracks seasonal and
  agricultural drought; SPEI-12 tracks hydrological and multi-year drought.
resource_type: dataset
license: CC-BY-4.0 # Atlas-derived product; CHIRPS and CHIRTS-ERA5 inputs are CC-BY-4.0
attribution: Derived from CHIRPS v3 and CHIRTS-ERA5, Climate Hazards Center, UC Santa Barbara.

keywords:
  [
    drought,
    SPEI,
    Standardized Precipitation-Evapotranspiration Index,
    climatic water balance,
    potential evapotranspiration,
    Hargreaves,
    log-logistic,
    ENSO,
  ]

note: >
  Files for the first months of each accumulation window exist but hold no data (1981-01 to
  1981-02 for SPEI-03, 1981-01 to 1981-11 for SPEI-12). In arid cells the log-logistic fit is
  poorly constrained: non-finite results are stored as NoData, and magnitudes well beyond ±3 can
  occur where the fit is degenerate rather than indicating record drought or wetness.

contact:
  - name: Peter Steward
    organization: Alliance of Bioversity International and CIAT
    email: p.steward@cgiar.org
    roles: [producer, processor, point-of-contact, maintainer]
  - organization: Alliance of Bioversity International and CIAT
    url: https://alliancebioversityciat.org/
    roles: [licensor]

citation:
  authors:
    - family: Steward
      given: P.
  date: "2026"
  publisher: Alliance of Bioversity International and CIAT
related_publications:
  - doi: 10.1175/2009JCLI2909.1
    citation:
      title: "A Multiscalar Drought Index Sensitive to Global Warming: The Standardized Precipitation Evapotranspiration Index"
      authors:
        - family: Vicente-Serrano
          given: S. M.
        - family: Beguería
          given: S.
        - family: López-Moreno
          given: J. I.
      date: "2010"
      publisher: Journal of Climate
  - doi: 10.13031/2013.26773
    citation:
      title: "Reference Crop Evapotranspiration from Temperature"
      authors:
