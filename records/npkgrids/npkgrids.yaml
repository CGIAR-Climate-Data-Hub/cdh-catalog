# yaml-language-server: $schema=https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.4.1/schemas/profiles/cdh.schema.bundled.json
# FAO-published NPKGRIDS fertilizer application rate maps, federated from FAO's public bucket.
cdh_schema_version: "v0.4.1"
extensions:
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.4.1/extensions/cdh/schema.json
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.4.1/extensions/agriculture/schema.json

id: npkgrids
title: NPKGRIDS crop-specific fertilizer application rates circa 2020 (FAO)
version: "2.0" # as labelled on the FAO data catalog
series:
  name: CROPGRIDS
  url: https://data.apps.fao.org/catalog/dataset/cropgrids
description: >
  NPKGRIDS maps synthetic fertilizer application rates of nitrogen (N), phosphorus (as P2O5) and
  potassium (as K2O) for 173 crops circa 2020 (a 2015 to 2020 average) on a global 0.05 degree grid
  (about 5.6 km at the equator), in kilograms per hectare of harvested area. Eight fertilizer
  datasets are fused and spread over the CROPGRIDS crop masks. This is the FAO release, regenerated
  with FAO's Python pipeline, holding 167 crops for all three nutrients plus alfalfa for N and P,
  as one GeoTIFF per nutrient and crop.
license: CC-BY-4.0 # as declared on the FAO data catalog
resource_type: dataset

keywords:
  - NPKGRIDS
  - NPK
  - fertilizer use by crop
  - synthetic fertilizer
  - nutrient application rate
  - FAOSTAT
  - term: fertilizer application
    scheme: https://agrovoc.fao.org/
    uri: http://aims.fao.org/aos/agrovoc/c_10795
  - term: application rates
    scheme: https://agrovoc.fao.org/
    uri: http://aims.fao.org/aos/agrovoc/c_16113
note: >
  Rates are modelled, not observed. No nodata is set: ocean and cells without the crop hold 0.
  Small countries and territories are excluded by the resolution. Within-country patterns follow
  Mueller et al. (2012) where no newer subnational data exist. Values match the figshare release
  (Nguyen et al. 2024) up to minor numerical deviations.

