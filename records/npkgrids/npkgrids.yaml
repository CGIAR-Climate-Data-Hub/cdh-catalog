processing:
  - id: source
    description: >
      FAO re-implementation of the NPKGRIDS data fusion pipeline (Nguyen et al. 2024) in Python,
      documented in Bottini et al. (2026). Eight fertilizer datasets are harmonized to rates per
      hectare of harvested area and to the CROPGRIDS crop classification, ranked by quality
      indicators per nutrient, crop and subnational unit, gap-filled from neighbouring units and
      similar crops, and spread uniformly over the cells of the FAO CROPGRIDS crop masks. Output
      is one GeoTIFF per nutrient and crop. The code is not public as of this record.
    date: "2025-11-20"
    derived_from:
      - id: cropgrids
        version: "2.0"
        title: CROPGRIDS crop masks used to spatialize the rates
      - url: https://doi.org/10.1038/nature11420
        title: Mueller et al. (2012) gridded N, P, K application rates, used for within-country allocation

data:
  - name: cogs
    structures: [cogs]
    locations:
      - url: https://storage.googleapis.com/fao-gismgr-faostat-data/DATA/FAOSTAT/MAPSET/
        title: HTTPS
      - url: gs://fao-gismgr-faostat-data/DATA/FAOSTAT/MAPSET/
        title: GCS
    href_template: "CG-{nutrient}/FAOSTAT.CG-{nutrient}.2020.{crop}.tif"
    processing_steps: [source]
    description: >
      Cloud-optimized GeoTIFFs, one per nutrient and crop (LZW, 512 px tiles, overviews), about 125
      MB per nutrient. The CG-N and CG-P folders also hold ALFALFA, which is not in the crop list
      because CG-K lacks it.
    media_type: "image/tiff; application=geotiff; profile=cloud-optimized"

