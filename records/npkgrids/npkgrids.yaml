processing:
  - id: source
    description: >
      FAO Python re-implementation of the NPKGRIDS pipeline (Bottini et al. 2026): inputs
      harmonized to rates per harvested hectare, ranked by quality per nutrient, crop and
      subnational unit, gap-filled from neighbours and similar crops, and spread uniformly over the
      CROPGRIDS crop masks. Code not public as of this record.
    date: "2025-11-20"
    derived_from:
      - id: cropgrids
        version: "2.0"
        title: CROPGRIDS crop masks used to spatialize the rates
      - url: https://doi.org/10.1038/nature11420
        title: Mueller et al. (2012) gridded N, P, K application rates, used for within-country allocation

data:
  - name: cogs
    structures: [cogs]
    locations:
      - url: https://storage.googleapis.com/fao-gismgr-faostat-data/DATA/FAOSTAT/MAPSET/
        title: HTTPS
      - url: gs://fao-gismgr-faostat-data/DATA/FAOSTAT/MAPSET/
        title: GCS
    href_template: "CG-{nutrient}/FAOSTAT.CG-{nutrient}.2020.{crop}.tif"
    processing_steps: [source]
    description: One COG per nutrient and crop for the 167 crops in all three mapsets, about 125 MB per nutrient.
    media_type: "image/tiff; application=geotiff; profile=cloud-optimized"
  - name: alfalfa-cogs
    structures: [alfalfa]
    locations:
      - url: https://storage.googleapis.com/fao-gismgr-faostat-data/DATA/FAOSTAT/MAPSET/
        title: HTTPS
      - url: gs://fao-gismgr-faostat-data/DATA/FAOSTAT/MAPSET/
        title: GCS
    href_template: "CG-{nutrient}/FAOSTAT.CG-{nutrient}.2020.{crop}.tif"
    processing_steps: [source]
    description: The two ALFALFA files, which exist for N and P but not K.
    media_type: "image/tiff; application=geotiff; profile=cloud-optimized"

