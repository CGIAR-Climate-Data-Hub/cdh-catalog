id: npkgrids
title: NPKGRIDS crop-specific fertilizer application rates circa 2020 (FAO)
version: "2.0" # as labelled on the FAO data catalog
series:
  name: CROPGRIDS
  url: https://data.apps.fao.org/catalog/dataset/cropgrids
description: >
  NPKGRIDS maps synthetic fertilizer application rates of nitrogen (N), phosphorus (as P2O5) and
  potassium (as K2O) for 173 crops circa 2020 (a 2015 to 2020 average) on a global 0.05 degree grid
  (about 5.6 km at the equator). Rates are kilograms of nutrient per hectare of harvested area. The
  maps were built by fusing the CROPGRIDS crop masks with eight published fertilizer-rate datasets
  and benchmarking national totals against FAO and International Fertilizer Association (IFA)
  statistics. This record describes the release regenerated by FAO with its own Python
  implementation of the pipeline and published on FAO's geospatial platforms. It holds 167 of the
  173 crops for all three nutrients and is served as one cloud-optimized GeoTIFF per nutrient and
  crop.
license: CC-BY-4.0 # as declared on the FAO data catalog
resource_type: dataset

keywords:
  - NPKGRIDS
  - NPK
  - fertilizer use by crop
  - synthetic fertilizer
  - nutrient application rate
  - FAOSTAT
  - term: fertilizer application
    scheme: https://agrovoc.fao.org/
    uri: http://aims.fao.org/aos/agrovoc/c_10795
  - term: application rates
    scheme: https://agrovoc.fao.org/
    uri: http://aims.fao.org/aos/agrovoc/c_16113
note: >
  Rates are modelled from national and subnational statistics, not observed. The rasters carry no
  nodata value: ocean and cells without the crop hold 0. Small countries and territories are
  excluded by the grid resolution. Within-country patterns rest on Mueller et al. (2012)
  allocations where no newer subnational data exist. Values reproduce the figshare release of
  Nguyen et al. (2024) with minor numerical deviations.

