    variables:
      - &application_rate
        name: application_rate
        description: Synthetic fertilizer application rate of the nutrient on the crop, per hectare of harvested area.
        data_type: float32
        unit: kg ha-1
        note: >
          Relative quantity; do not sum across cells. Use a weighted mean with CROPGRIDS harvested
          area as the weight, or multiply by harvested area to get applied mass.

  # ALFALFA is published for N and P only, so it gets its own file set.
  - name: alfalfa
    dimensions:
      - *cell
      - name: nutrient
        type: nutrient
        description: Fertilizer nutrient, the {nutrient} token of the file paths (mapsets CG-N, CG-P).
        data_type: string
        categories:
          - { value: N, label: Nitrogen (N) }
          - { value: P, label: Phosphorus as phosphorus pentoxide (P2O5) }
      - name: crop
        type: crop
        description: FAO crop code, the {crop} token of the file names.
        reference_system: https://data.apps.fao.org/gismgr/api/v2/catalog/workspaces/FAOSTAT/dimensions/CROP
        data_type: string
        categories:
          - { value: ALFALFA, label: Alfalfa }
    variables: [*application_rate]

cdh:
  domain: [agricultural-production]
  usage:
    intended_uses:
      - global and regional mapping of fertilizer use by crop and nutrient
      - nutrient budget, emissions, and environmental impact modelling
      - spatial targeting at national and sub-national scale
    not_recommended_for:
      - use: field-scale fertilizer recommendations
        reason: the grid is too coarse and the rates are statistical allocations, not agronomic advice.
        use_instead: local soil tests and extension guidance.

