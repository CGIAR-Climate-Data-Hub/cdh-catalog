id: drabo-gbo-plant-species
version: '1'
title: Plant species of Drabo Gbo Forest, Benin
description: A comprehensive inventory of the 655 plant species recorded in the Drabo Gbo Forest, a 14-hectare rehabilitated
  secondary rainforest patch in southern Benin regenerated over about 28 years. The list documents species composition, taxonomic
  identity, phytogeographic origin, introduction history and survival status following long-term ecological restoration.
