spatial:
  bbox:
    - -180
    - -60
    - 180
    - 60
  crs: EPSG:4326
  geography:
    - world
temporal:
  start_date: "1981-01-01"
  end_date: null
  update_frequency: monthly
structures:
  - name: daily
    dimensions:
      - &cell
        name: cell
        type: xy
        description: 0.05° (~5 km at equator).
        step: 0.05
        unit: degree
      - &time
        name: time
        type: temporal
        description: Day of the precipitation total; the {time} token of the daily files.
        extent: ["1981-01-01", "2026-08-31"] # files present as of `updated`; may lag the data, never lead it
        step: P1D
    variables:
      - name: precipitation
        description: Daily accumulated precipitation
        data_type: float32
        unit: mm
        nodata: -9999

  # dynamical.org Icechunk store: stored as a rate, not a daily total.
  - name: icechunk
    dimensions:
      - <<: *cell
        description: 0.05° (~5 km at equator), named latitude and longitude.
      - name: time
        type: temporal
        description: Start of the 24-hour period, from 1981-01-01. Extended monthly.
        step: P1D
    variables:
      - name: precipitation_surface
        description: Mean precipitation rate over the 24 hours starting at the time coordinate.
        data_type: float32
        unit: kg m-2 s-1
        nodata: "NaN"
        note: >
          Equivalent to mm/s; multiply by 86400 for the daily total in mm. Low mantissa bits are
          rounded to improve compression. NaN over oceans.

  # Zarr: daily totals packed as int16.
  - name: zarr
    dimensions:
      - <<: *cell
        description: 0.05° (~5 km at equator), named lat and lon. lat runs north to south.
      - <<: *time
        description: Day of the precipitation total.
        extent: ["1981-01-01", "2026-10-31"] # as of `updated`
    variables:
      - name: precip
        description: Daily accumulated precipitation
        data_type: int16
        unit: mm
        nodata: -9999
        note: >
          Stored as int16 with scale_factor 0.1, so values differ from the GeoTIFFs by at most
          0.05 mm. xarray rescales; GDAL (3.11 or newer) returns raw counts.
data:
  - name: icechunk
    structures: [icechunk]
    locations:
      - url: s3://dynamical-ucsb-chc-chirps/ucsb-chc-chirps-analysis-final/v0.1.0.icechunk/
        title: S3 (anonymous, us-west-2)
      - url: https://dynamical-ucsb-chc-chirps.s3.us-west-2.amazonaws.com/ucsb-chc-chirps-analysis-final/v0.1.0.icechunk
        title: HTTPS
    description: >
      Icechunk v2 repository built and hosted by [dynamical.org](https://dynamical.org/)
      on AWS Open Data and updated monthly. Open the `main` branch with xarray via icechunk. Chunked
      365 days x 3° x 3° (sharded 365 days x 60° x ~90°), suited to long time series over a region.
      Credit "UCSB Climate Hazards Center CHIRPS version 3.0 data processed by dynamical.org from the
      Climate Hazards Center data archive."
    media_type: application/x-icechunk
    processing_steps: [source, cloud-optimize-dynamical]
  - name: zarr
    structures: [zarr]
    locations:
      - url: https://huggingface.co/datasets/aaguilar90/chirps-v3-daily-rnl/resolve/main/chirps-v3-daily-rnl.zarr
        title: HTTPS
    description: >
      Zarr v3 store built by Andres Aguilar Ariza, chunked 128 days x 300 lat x 300 lon (about 4
      months x 15° x 15°), for bounding-box and time-range reads in daily mm.
    media_type: application/vnd.zarr; version=3
    file_size: 34 GB
    processing_steps: [source, cloud-optimize]
  - name: geotiff
    structures: [daily]
    locations:
      - url: https://data.chc.ucsb.edu/products/CHIRPS/v3.0/daily/final/rnl/
        title: HTTPS
    href_template: "{time:%Y}/chirps-v3.0.rnl.{time:%Y.%m.%d}.tif"
    processing_steps:
      - source
    description: >-
      Daily GeoTIFF files, one per day in yearly folders. Daily values are CHIRPS v3 pentad totals
      disaggregated with ERA5 daily precipitation (the "rnl" variant).
    media_type: image/tiff; application=geotiff
processing:
  - id: source
    description: Original CHIRPS v3 daily release from the Climate Hazards Center
    derived_from:
      - url: https://data.chc.ucsb.edu/products/CHIRPS/v3.0/
        title: CHIRPS v3.0 data portal
        version: v3.0
  - id: cloud-optimize-dynamical
    description: >
      dynamical.org reformats the daily final/rnl GeoTIFFs into an Icechunk repository, converting
      daily totals to a precipitation rate and rounding low mantissa bits for compression.
    code:
      url: https://github.com/dynamical-org/reformatters
  - id: cloud-optimize
    description: >
      Stacks the daily final/rnl GeoTIFFs into one Zarr v3 store, packed as
      int16 at 0.1 mm with Zstandard compression.
    date: "2026-11-14"
cdh:
  domain:
    - climate
  usage:
    intended_uses:
      - daily rainfall inputs for crop and hydrological models
      - drought monitoring and seasonal rainfall anomalies
    not_recommended_for:
      - use: areas poleward of 60° latitude
        reason: CHIRPS v3 covers 60°S to 60°N only.
        use_instead: ERA5 or AgERA5 precipitation.
      - use: sub-daily rainfall analysis
        reason: daily values are disaggregated from pentad totals with ERA5, so within-day timing is not observed.
        use_instead: IMERG half-hourly precipitation.
