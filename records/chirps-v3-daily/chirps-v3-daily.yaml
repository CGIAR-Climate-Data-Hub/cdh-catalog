spatial:
  bbox:
    - -180
    - -50
    - 180
    - 50
  crs: EPSG:4326
  geography:
    - world
temporal:
  start_date: "1981-01-01"
  end_date: null
  update_frequency: monthly
structures:
  - name: daily
    dimensions:
      - name: cell
        type: xy
        description: 0.05° (~5 km at equator).
        step: 0.05
        unit: degree
      - name: time
        type: temporal
        description: Day of the precipitation total; the {time} token of the daily files.
        extent: ["1981-01-01", "2026-08-31"] # files present as of `updated`; may lag the data, never lead it
        step: P1D
    variables:
      - name: precipitation
        description: Daily accumulated precipitation
        data_type: float32
        unit: mm
        nodata: -9999
data:
  - name: geotiff
    locations:
      - url: https://data.chc.ucsb.edu/products/CHIRPS/v3.0/daily/final/rnl/
        title: HTTPS
    href_template: "{time:%Y}/chirps-v3.0.rnl.{time:%Y.%m.%d}.tif"
    processing_steps:
      - source
    description: >-
      Daily GeoTIFF files, one per day in yearly folders. Daily values are CHIRPS v3 pentad totals
      disaggregated with ERA5 daily precipitation (the "rnl" variant).
    media_type: image/tiff; application=geotiff
processing:
  - id: source
    description: Original CHIRPS v3 daily release from the Climate Hazards Center
    derived_from:
      - url: https://data.chc.ucsb.edu/products/CHIRPS/v3.0/
        title: CHIRPS v3.0 data portal
        version: v3.0
cdh:
  domain:
    - climate
  usage:
    intended_uses:
      - daily rainfall inputs for crop and hydrological models
      - drought monitoring and seasonal rainfall anomalies
    not_recommended_for:
      - use: areas poleward of 50° latitude
        reason: CHIRPS covers 50°S to 50°N only.
        use_instead: ERA5 or AgERA5 precipitation.
      - use: sub-daily rainfall analysis
        reason: daily values are disaggregated from pentad totals with ERA5, so within-day timing is not observed.
        use_instead: IMERG half-hourly precipitation.
