    description: Element 84's searchable STAC items for the AWS tiles, the source of the GeoParquet snapshot.
  - title: Earth Search STAC API collection, GLO-90
    rel: describedby
    url: https://earth-search.aws.element84.com/v1/collections/cop-dem-glo-90
  - title: Sentinel Hub static STAC collection, GLO-30
