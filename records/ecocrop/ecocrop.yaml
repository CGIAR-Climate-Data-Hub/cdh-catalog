cdh:
  domain: [agricultural-production, adaptation]
  usage:
    intended_uses:
      - parameterising EcoCrop-type climatic suitability models with temperature, rainfall and crop-cycle thresholds
      - screening candidate crops for a location by temperature, rainfall, soil and photoperiod requirements
      - looking up species attributes by scientific name, EcoPort code or use category
    not_recommended_for:
      - use: Treating thresholds as validated field or trial results.
        reason: Values are expert estimates with no per-species provenance, and some rows hold obvious errors.
      - use: Applying the rainfall thresholds as growing-season totals without checking.
        reason: EcoCrop records rainfall as an annual total; suitability models reinterpret it over the crop cycle and results differ.

commodities: [crops]
