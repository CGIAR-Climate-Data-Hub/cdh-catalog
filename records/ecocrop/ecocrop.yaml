# yaml-language-server: $schema=https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.4.1/schemas/profiles/cdh.schema.bundled.json
# FAO EcoCrop crop requirement thresholds, cleaned from the OpenCLIM CSV snapshot into one Parquet table.
cdh_schema_version: v0.4.1
extensions:
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.4.1/extensions/cdh/schema.json
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.4.1/extensions/agriculture/schema.json

id: ecocrop
title: EcoCrop crop ecological requirements database (FAO)
version: "1"
description: >
  Expert-compiled ecological requirements for 2,568 plant species from the FAO EcoCrop database:
  optimal and absolute ranges of temperature, rainfall, soil pH, latitude and altitude, killing
  temperatures, crop cycle length in days, plus categorical soil, light, photoperiod, climate zone
  and life-form attributes. One row per species, keyed by EcoPort code. The table is a cleaned copy
  of the CSV snapshot published by the OpenCLIM EcoCrop suitability model (UK Centre for Ecology &
  Hydrology), with the FAO column codes kept so values map directly onto EcoCrop-type suitability
  models.
resource_type: dataset
license: CC-BY-4.0 # as declared on the FAO data catalog, https://data.apps.fao.org/catalog/dataset/ecocrop
attribution: Source data from the FAO EcoCrop database, Food and Agriculture Organization of the United Nations.

keywords:
  [
    crop suitability,
    crop requirements,
    ecological thresholds,
    temperature thresholds,
    rainfall thresholds,
    crop cycle,
    killing temperature,
    EcoCrop,
    EcoPort,
    species database,
  ]

note: >
  Values are expert estimates of uneven provenance, not measurements. 495 of 2,568 species have no
  temperature or rainfall thresholds at all; killing temperature is missing for 1,411. A few rows
  hold obvious errors in the source (latitude limits above 90, an optimal minimum temperature of
  160 for Barringtonia racemosa) that are kept as published. EcoCrop records rainfall as an annual
  total; suitability models usually apply it over the crop cycle (gmin to gmax days).

