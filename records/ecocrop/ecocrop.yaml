structures:
  - name: species-requirements
    dimensions:
      - name: ecoportcode
        type: crop
        description: >
          EcoPort species code, the EcoCrop primary key. One row per species. The FAO datasheet for
          a code is https://ecocrop.apps.fao.org/ecocrop/srv/en/dataSheet?id=<ecoportcode>.
        reference_system: https://ecocrop.apps.fao.org/ecocrop/srv/en/home
        data_type: integer
    variables:
      # identity
      - name: scientificname
        description: Accepted scientific name (genus and species).
        data_type: string
      - name: auth
        description: Taxonomic authority for the scientific name.
        data_type: string
      - name: famname
        description: Classification path class:subclass:order:family, colon-separated.
        data_type: string
      - name: syno
        description: Synonyms, split on commas outside parentheses; items are free text as published.
        data_type: other
      - name: comname
        description: Common names in many languages, split on commas outside parentheses.
        data_type: other
      # plant attributes (multi-valued columns are list<string>)
      - name: lifo
        description: "Life form: tree, shrub, herb, grass, vine, or combinations."
        data_type: other
      - name: habi
        description: "Growth habit: erect, prostrate/procumbent/semi-erect, climber/scrambler/scadent."
        data_type: other
      - name: lispa
        description: "Life span: annual, biennial, perennial."
        data_type: other
      - name: phys
        description: "Physiology: single stem, multi stem, evergreen, deciduous, C3/C4 and similar."
        data_type: other
      - name: cat
        description: "Use category: cereals & pseudocereals, vegetables, forage/pasture, forest/wood, medicinals & aromatic, and others."
        data_type: other
      - name: plat
        description: "Plant attributes: grown on large scale, grown on small scale, harvested from wild."
        data_type: other
      - name: prosy
        description: "Production system: large scale/commercial, small scale (manual), home garden, and others."
        data_type: other
      # temperature
      - name: topmn
        description: Optimal minimum temperature.
        data_type: int64
        unit: degC
      - name: topmx
        description: Optimal maximum temperature.
        data_type: int64
        unit: degC
      - name: tmin
        description: Absolute minimum temperature; growth stops below this.
        data_type: int64
        unit: degC
      - name: tmax
        description: Absolute maximum temperature; growth stops above this.
        data_type: int64
        unit: degC
      - name: ktmp
        description: Killing temperature during early growth. Missing for 1,411 species.
        data_type: int64
        unit: degC
      - name: ktmpr
        description: Killing temperature during rest (dormancy). Missing for 1,411 species.
        data_type: int64
        unit: degC
      # rainfall
      - name: ropmn
        description: Optimal minimum rainfall, recorded by EcoCrop as an annual total.
        data_type: int64
        unit: mm
      - name: ropmx
        description: Optimal maximum rainfall, annual total.
        data_type: int64
        unit: mm
      - name: rmin
        description: Absolute minimum rainfall, annual total.
        data_type: int64
        unit: mm
      - name: rmax
        description: Absolute maximum rainfall, annual total.
        data_type: int64
        unit: mm
      # crop cycle
      - name: gmin
        description: Minimum crop cycle, days from sowing or planting to harvest.
        data_type: int64
        unit: d
      - name: gmax
        description: Maximum crop cycle in days. Perennials are commonly recorded as 365.
        data_type: int64
        unit: d
      # soil pH
      - name: phopmn
        description: Optimal minimum soil pH.
        data_type: float64
        unit: "[pH]"
      - name: phopmx
        description: Optimal maximum soil pH.
        data_type: float64
        unit: "[pH]"
      - name: phmin
        description: Absolute minimum soil pH.
        data_type: float64
        unit: "[pH]"
      - name: phmax
        description: Absolute maximum soil pH.
        data_type: float64
        unit: "[pH]"
      # geography
      - name: latopmn
        description: Optimal minimum latitude, absolute value in degrees from the equator.
        data_type: float64
        unit: degree
      - name: latopmx
        description: Optimal maximum latitude, degrees from the equator.
        data_type: float64
        unit: degree
      - name: latmn
        description: Absolute minimum latitude, degrees from the equator. A few source rows exceed 90 and are errors.
        data_type: float64
        unit: degree
      - name: latmx
        description: Absolute maximum latitude, degrees from the equator. A few source rows exceed 90 and are errors.
        data_type: float64
        unit: degree
      - name: altmx
        description: Absolute maximum altitude.
        data_type: int64
        unit: m
      # light and photoperiod
      - name: liopmn
        description: "Optimal minimum light intensity: very bright, clear skies, cloudy skies, light shade, heavy shade."
        data_type: string
      - name: liopmx
        description: Optimal maximum light intensity, same classes as liopmn.
        data_type: string
      - name: limn
        description: Absolute minimum light intensity, same classes as liopmn.
        data_type: string
      - name: limx
        description: Absolute maximum light intensity, same classes as liopmn.
        data_type: string
      - name: photo
        description: "Photoperiod sensitivity: short day (<12 hours), neutral day (12-14 hours), long day (>14 hours)."
        data_type: other
      - name: cliz
        description: "Climate zones where the species is grown, Köppen-style labels as published, e.g. tropical wet & dry (Aw), subtropical humid (Cf)."
        data_type: other
      # soil
      - name: dep
        description: "Optimal soil depth: very shallow (<20 cm), shallow (20-50 cm), medium (50-150 cm), deep (>>150 cm)."
        data_type: string
      - name: depr
        description: Absolute soil depth, same classes as dep.
        data_type: string
      - name: text
        description: "Optimal soil texture: heavy, medium, light, organic, wide."
        data_type: other
      - name: textr
        description: Absolute soil texture, same classes as text.
        data_type: other
      - name: fer
        description: "Optimal soil fertility: high, moderate, low."
        data_type: string
      - name: ferr
        description: Absolute soil fertility, same classes as fer.
        data_type: string
      - name: tox
        description: "Optimal soil aluminium toxicity as share of cation exchange capacity: none (<5%), low (6-15%), medium (16-25%), high (>25%). Mostly empty."
        data_type: string
      - name: toxr
        description: Absolute soil aluminium toxicity, same classes as tox.
        data_type: string
      - name: sal
        description: "Optimal soil salinity: none, low (<4 dS/m), medium (4-10 dS/m), high (>10 dS/m)."
        data_type: string
      - name: salr
        description: Absolute soil salinity, same classes as sal.
        data_type: string
      - name: dra
        description: "Optimal soil drainage: well (dry spells), poorly (saturated >50% of year), excessive (dry/moderately dry)."
        data_type: other
      - name: drar
        description: Absolute soil drainage, same classes as dra.
        data_type: other
      # tolerances and risks
      - name: abitol
        description: "Abiotic tolerances: drought, flooding, fire, wind, salinity, frost, and others."
        data_type: other
      - name: abisus
        description: Abiotic susceptibilities, same classes as abitol.
        data_type: other
      - name: intri
        description: "Introduction risk: can become a weed, poisonous to man or animals, susceptible to nematodes, and others."
        data_type: other

processing:
  - id: source
    description: >
      FAO EcoCrop database as exported to CSV in the OpenCLIM EcoCrop suitability model repository
      (2,568 species, 55 columns, Windows-1252 encoded, missing values as "NA" or empty). FAO no
      longer offers a bulk download, so the copy pinned at commit ea43ecd is the reference source.
      Checked against the live FAO tool on 2026-10-09: same species set, IDs, names and values.
    derived_from:
      - title: FAO EcoCrop database
        url: https://gaez.fao.org/pages/ecocrop
      - title: EcoCrop_DB.csv in the OpenCLIM ecocrop repository, pinned at commit ea43ecd (2022-03-01)
        url: https://github.com/OpenCLIM/ecocrop/blob/ea43ecd418fd1a1ea08d32c7dce64b7fae02dec4/EcoCrop_DB.csv
        version: ea43ecd
  - id: clean
    description: >
      Decoded from Windows-1252 to UTF-8, column names lowercased, "NA" and empty strings set to
      null, numeric columns typed, multi-valued columns split on commas (outside parentheses for
      synonyms and common names) into list<string>, values trimmed. No rows dropped or values corrected. Written as one Parquet file
      sorted by ecoportcode.
    code:
      url: https://github.com/CGIAR-Climate-Data-Hub/cdh-data-pipeline/blob/main/recipes/ecocrop.py
      version: 5eaee18
    date: "2026-10-09"

data:
  - name: table
    description: One row per species.
    locations:
      - url: https://digital-atlas.s3.amazonaws.com/cdh/data/ecocrop/ecocrop.parquet
        title: HTTPS
      - url: s3://digital-atlas/cdh/data/ecocrop/ecocrop.parquet
        title: S3
    media_type: application/vnd.apache.parquet
    file_size: 293 KB
    processing_steps: [source, clean]

additional_assets:
  - name: column lookup
    description: Source column code to description list from the OpenCLIM repository.
    locations:
      - url: https://github.com/OpenCLIM/ecocrop/blob/f13577f4237604b15d85d8e43741714a2d1eb2d4/Ecocrop_variable_lookup.csv
    media_type: text/csv
    roles: [metadata, describedby]
    file_size: 2 KB

