spatial:
  bbox: [-180, -56, 180, 84]
  geography: [world]
  crs: EPSG:4326

temporal:
  date: "2017" # static maps from the 2017 release

structures:
  - name: probability
    dimensions:
      - &cell
        name: cell
        type: xy
        description: 7.5 arc-second cells (~250 m at the equator).
        step: 0.0020833333
        unit: degree
      - name: rsg
        type: soil_group
        description: WRB reference soil group, the {rsg} token of the file names (WRB 2006 names, so Albeluvisols rather than Retisols).
        reference_system: https://www.fao.org/soils-portal/data-hub/soil-classification/world-reference-base/en/
        data_type: string
        values:
          - Acrisols
          - Albeluvisols
          - Alisols
          - Andosols
          - Arenosols
          - Calcisols
          - Cambisols
          - Chernozems
          - Cryosols
          - Durisols
          - Ferralsols
          - Fluvisols
          - Gleysols
          - Gypsisols
          - Histosols
          - Kastanozems
          - Leptosols
          - Lixisols
          - Luvisols
          - Nitisols
          - Phaeozems
          - Planosols
          - Plinthosols
          - Podzols
          - Regosols
          - Solonchaks
          - Solonetz
          - Stagnosols
          - Umbrisols
          - Vertisols
    variables:
      - name: probability
        description: Predicted probability that the cell's soil belongs to the reference soil group, in percent.
        data_type: uint8
        unit: "%"
        nodata: 255
  - name: most-probable
    dimensions: [*cell]
    variables:
      - name: MostProbable
        description: Reference soil group with the highest predicted probability in the cell.
        data_type: uint8
        nodata: 255
        categories:
          - { value: 0, label: Acrisols }
          - { value: 1, label: Albeluvisols }
          - { value: 2, label: Alisols }
          - { value: 3, label: Andosols }
          - { value: 4, label: Arenosols }
          - { value: 5, label: Calcisols }
          - { value: 6, label: Cambisols }
          - { value: 7, label: Chernozems }
          - { value: 8, label: Cryosols }
          - { value: 9, label: Durisols }
          - { value: 10, label: Ferralsols }
          - { value: 11, label: Fluvisols }
          - { value: 12, label: Gleysols }
          - { value: 13, label: Gypsisols }
          - { value: 14, label: Histosols }
          - { value: 15, label: Kastanozems }
          - { value: 16, label: Leptosols }
          - { value: 17, label: Lixisols }
          - { value: 18, label: Luvisols }
          - { value: 19, label: Nitisols }
          - { value: 20, label: Phaeozems }
          - { value: 21, label: Planosols }
          - { value: 22, label: Plinthosols }
          - { value: 23, label: Podzols }
          - { value: 24, label: Regosols }
          - { value: 25, label: Solonchaks }
          - { value: 26, label: Solonetz }
          - { value: 27, label: Stagnosols }
          - { value: 28, label: Umbrisols }
          - { value: 29, label: Vertisols }

cdh:
  domain: [agricultural-production]
  usage:
    intended_uses:
      - soil type inputs to crop, land evaluation, and ecosystem models at national to global scale
      - stratifying or masking analyses by dominant soil group
    not_recommended_for:
      - use: field-scale soil identification
        reason: values are 250 m model predictions from a 2017 model with modest class accuracy, not survey observations.
        use_instead: national soil survey maps or local profile descriptions.

processing:
  - id: source
    description: >
      SoilGrids250m 2017: ensemble of multinomial log-linear neural network (nnet) and random
      forest (ranger) models fitted on WoSIS soil profiles with WRB classes and global covariates,
      predicting per-class probabilities (Hengl et al. 2017).
    date: "2017-03-10"
    derived_from:
      - title: WoSIS soil profile database
        url: https://www.isric.org/explore/wosis
  - id: regenerate
    description: >
      Class layers regenerated from the 2017 outputs with ISRIC's WRB mapping scripts to fix a
      distortion at low latitudes, and tiled as VRT mosaics.
    code:
      url: https://git.wur.nl/isric/soilgrids/SoilGrids250m/-/tree/master/mapping/wrb
    date: "2022-03-01"

data:
  - name: probability
    structures: [probability]
    locations:
      - url: https://files.isric.org/soilgrids/latest/data/wrb/
        title: HTTPS (WebDAV)
    href_template: "{rsg}.vrt"
    processing_steps: [source, regenerate]
    description: >
      One GDAL VRT per reference soil group, mosaicking the 4096x4096 GeoTIFF tiles in the folder of
      the same name beside it, with a .vrt.ovr overview file.
  - name: most-probable
    structures: [most-probable]
    locations:
      - url: https://files.isric.org/soilgrids/latest/data/wrb/MostProbable.vrt
        title: HTTPS (WebDAV)
    processing_steps: [source, regenerate]
    description: GDAL VRT mosaicking the tiles in the MostProbable folder beside it.

additional_assets:
  - name: most-probable-legend
    roles: [metadata, describedby]
    media_type: application/json
    description: Pixel value to reference soil group name for MostProbable.
    locations:
      - url: https://files.isric.org/soilgrids/latest/data/wrb/MostProbable.rat.json
  - name: most-probable-style
    roles: [visual]
    media_type: application/vnd.ogc.sld+xml
    description: SLD colour style for the MostProbable map.
    locations:
      - url: https://files.isric.org/soilgrids/latest/data/wrb/MostProbable.sld
  - name: most-probable-preview
    roles: [overview]
    media_type: image/png
    description: Global rendering of the MostProbable map.
    locations:
      - url: https://files.isric.org/soilgrids/latest/data/wrb/MostProbable.png

