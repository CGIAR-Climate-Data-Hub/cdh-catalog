cdh:
  domain: [land, agricultural-production]
  usage:
    intended_uses:
      - soil type inputs to crop, land evaluation, and ecosystem models at national to global scale
      - stratifying or masking analyses by dominant soil group
    not_recommended_for:
      - use: field-scale soil identification
        reason: values are 250 m predictions from the 2017 model with modest class accuracy, not survey observations.
        use_instead: national soil survey maps or local profile descriptions.

processing:
  - id: source
    description: >
      SoilGrids250m 2017: ensemble of multinomial log-linear neural network (nnet) and random
      forest (ranger) models fitted on WoSIS soil profiles with WRB classes and global covariates,
      predicting per-class probabilities (Hengl et al. 2017).
    date: "2017-03-10"
    derived_from:
      - title: WoSIS soil profile database
        url: https://www.isric.org/explore/wosis
      - title: SoilGrids250m 2017 TAXNWRB class probability layers
        url: https://files.isric.org/soilgrids/former/2017-03-10/data/
        version: "2017-03-10"
  - id: aggregate
    description: >
      The 2017 qualifier-level probabilities summed into one map per reference soil group, and the
      group with the highest probability written as MostProbable. Published as part of SoilGrids 2.0.
    date: "2020-05-04"
  - id: regenerate
    description: >
      Layers regenerated with ISRIC's WRB mapping scripts to fix a distortion at low latitudes, and
      tiled as VRT mosaics.
    code:
      url: https://git.wur.nl/isric/soilgrids/SoilGrids250m/-/tree/master/mapping/wrb
    date: "2022-03-01"

# The tiles of a map sit in a folder named after it, with the VRT that mosaics them beside the
# folder, so each tile set is the data entry and its VRT is the file index.
data:
  - name: probability
    structures: [probability]
    locations:
      - url: https://files.isric.org/soilgrids/latest/data/wrb/
        title: HTTPS (WebDAV)
    media_type: image/tiff; application=geotiff
    processing_steps: [source, aggregate, regenerate]
    description: 4096x4096 GeoTIFF tiles, one folder per reference soil group at {rsg}/.
    file_index:
      - format: vrt
        title: One VRT per reference soil group beside its tile folder, with a .vrt.ovr overview file
        href_template: "{rsg}.vrt"
        locations:
          - url: https://files.isric.org/soilgrids/latest/data/wrb/
            title: HTTPS (WebDAV)
  - name: most-probable
    structures: [most-probable]
    locations:
      - url: https://files.isric.org/soilgrids/latest/data/wrb/MostProbable/
        title: HTTPS (WebDAV)
    media_type: image/tiff; application=geotiff
    processing_steps: [source, aggregate, regenerate]
    description: 4096x4096 GeoTIFF tiles of the most probable group.
    file_index:
      - format: vrt
        title: VRT mosaicking the MostProbable tiles, with a .vrt.ovr overview file
        locations:
          - url: https://files.isric.org/soilgrids/latest/data/wrb/MostProbable.vrt
            title: HTTPS (WebDAV)

