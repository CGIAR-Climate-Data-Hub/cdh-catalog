# yaml-language-server: $schema=https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.4.1/schemas/profiles/cdh.schema.bundled.json
# SoilGrids 2017 WRB soil class maps, federated from ISRIC's WebDAV server through the per-class VRT mosaics.
# Separate from the soilgrids record because these are a 2017 product in EPSG:4326, not SoilGrids 2.0 in Homolosine.
cdh_schema_version: "v0.4.1"
extensions:
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.4.1/extensions/cdh/schema.json

id: soilgrids-wrb
title: SoilGrids 2017 WRB soil class probability maps at 250 m (ISRIC)
version: "2017" # SoilGrids250m 2017 release; layers regenerated by ISRIC in March 2022
series:
  name: SoilGrids
  url: https://www.isric.org/explore/soilgrids
description: >
  Probability of occurrence of each of 30 World Reference Base (WRB) reference soil groups, and
  the most probable group, for the globe on a 250 m grid. The maps come from the SoilGrids250m
  2017 release, where an ensemble of multinomial neural network and random forest models was
  fitted on about 150,000 WoSIS soil profiles and global environmental covariates. ISRIC regenerated
  the layers in 2022 to fix a distortion at low latitudes and serves them beside SoilGrids 2.0, but
  the classification is still the 2017 one. Each class map is a GDAL virtual raster (VRT) that
  mosaics a folder of GeoTIFF tiles in place, so it opens remotely with GDAL-based tools.
license: CC-BY-4.0 # as declared for the files.isric.org data folder; the original 2017 release was ODbL
resource_type: dataset

keywords:
  - SoilGrids
  - ISRIC
  - WRB
  - World Reference Base
  - reference soil group
  - term: soil classification
    scheme: https://agrovoc.fao.org/
    uri: http://aims.fao.org/aos/agrovoc/c_7162
  - term: soil types
    scheme: https://agrovoc.fao.org/
    uri: http://aims.fao.org/aos/agrovoc/c_7204
  - term: digital soil mapping
    scheme: https://agrovoc.fao.org/
    uri: http://aims.fao.org/aos/agrovoc/c_e4975629
note: >
  These are 2017 predictions, superseded in method by SoilGrids 2.0, which does not yet publish
  soil classes. The VRTs reference their tiles by relative path, so open them over HTTPS with
  GDAL's /vsicurl rather than downloading the .vrt alone, and read windows.
  Probabilities of the 30 groups in a cell do not always sum to exactly 100 because of rounding.

