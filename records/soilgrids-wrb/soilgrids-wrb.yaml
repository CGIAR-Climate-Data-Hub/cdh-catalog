spatial:
  bbox: [-180, -56, 180, 84]
  geography: [world]
  crs: EPSG:4326

temporal:
  date: "2020" # static maps, published 2020-05-04 from the 2017 predictions

structures:
  - name: probability
    dimensions:
      - &cell
        name: cell
        type: xy
        description: 7.5 arc-second cells (~250 m at the equator).
        step: 0.0020833333
        unit: degree
      - name: rsg
        type: soil_group
        description: WRB reference soil group, the {rsg} token of the file names (WRB 2006 names, so Albeluvisols rather than Retisols).
        reference_system: https://www.fao.org/soils-portal/data-hub/soil-classification/world-reference-base/en/
        data_type: string
        values:
          - Acrisols
          - Albeluvisols
          - Alisols
          - Andosols
          - Arenosols
          - Calcisols
          - Cambisols
          - Chernozems
          - Cryosols
          - Durisols
          - Ferralsols
          - Fluvisols
          - Gleysols
          - Gypsisols
          - Histosols
          - Kastanozems
          - Leptosols
          - Lixisols
          - Luvisols
          - Nitisols
          - Phaeozems
          - Planosols
          - Plinthosols
          - Podzols
          - Regosols
          - Solonchaks
          - Solonetz
          - Stagnosols
          - Umbrisols
          - Vertisols
    variables:
      - name: probability
        description: Predicted probability that the cell's soil belongs to the reference soil group, in percent.
        data_type: uint8
        unit: "%"
        nodata: 255
  - name: most-probable
    dimensions: [*cell]
    variables:
      - name: MostProbable
        description: Reference soil group with the highest predicted probability in the cell.
        data_type: uint8
        nodata: 255
        categories:
          - { value: 0, label: Acrisols }
          - { value: 1, label: Albeluvisols }
          - { value: 2, label: Alisols }
          - { value: 3, label: Andosols }
          - { value: 4, label: Arenosols }
          - { value: 5, label: Calcisols }
          - { value: 6, label: Cambisols }
          - { value: 7, label: Chernozems }
          - { value: 8, label: Cryosols }
          - { value: 9, label: Durisols }
          - { value: 10, label: Ferralsols }
          - { value: 11, label: Fluvisols }
          - { value: 12, label: Gleysols }
          - { value: 13, label: Gypsisols }
          - { value: 14, label: Histosols }
          - { value: 15, label: Kastanozems }
          - { value: 16, label: Leptosols }
          - { value: 17, label: Lixisols }
          - { value: 18, label: Luvisols }
          - { value: 19, label: Nitisols }
          - { value: 20, label: Phaeozems }
          - { value: 21, label: Planosols }
          - { value: 22, label: Plinthosols }
          - { value: 23, label: Podzols }
          - { value: 24, label: Regosols }
