# yaml-language-server: $schema=https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/schemas/profiles/cdh.schema.bundled.json
# SoilGrids 2.0 WRB soil class maps, federated from ISRIC's WebDAV server through the per-class VRT mosaics.
# Separate from the soilgrids record: aggregated from the 2017 predictions, not newly modelled, and in EPSG:4326.
cdh_schema_version: v0.5.0
extensions:
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/cdh/schema.json

id: soilgrids-wrb
title: SoilGrids 2.0 WRB reference soil group probability maps at 250 m (ISRIC)
version: "2.0" # as ISRIC labels it; published 2020-05-04, layers regenerated in March 2022
series:
  name: SoilGrids
  url: https://www.isric.org/explore/soilgrids
description: >
  Probability of occurrence of each of 30 World Reference Base (WRB 2006) reference soil groups,
  and the most probable group per cell, for the globe on a 250 m grid. These are the soil
  classification maps of SoilGrids 2.0, but they are not new predictions: ISRIC summed the
  qualifier-level class probabilities predicted in the SoilGrids250m 2017 release (multinomial
  neural network and random forest ensemble on about 150,000 WoSIS profiles) into one map per
  reference soil group, and took the highest as the most probable group. Anthrosols, Technosols and
  Retisols are not included. Each map is a GDAL virtual raster (VRT) that mosaics a folder of
  GeoTIFF tiles in place, so it opens remotely with GDAL-based tools.
license: CC-BY-4.0 # as declared in the ISRIC data catalogue record
resource_type: dataset

keywords:
  - SoilGrids
  - ISRIC
  - WRB
  - World Reference Base
  - reference soil group
  - term: soil classification
    scheme: https://agrovoc.fao.org/
    uri: http://aims.fao.org/aos/agrovoc/c_7162
  - term: soil types
    scheme: https://agrovoc.fao.org/
    uri: http://aims.fao.org/aos/agrovoc/c_7204
  - term: digital soil mapping
    scheme: https://agrovoc.fao.org/
    uri: http://aims.fao.org/aos/agrovoc/c_e4975629
note: >
  The underlying model is the 2017 one, not the quantile regression forests of the SoilGrids 2.0
  property maps, and ISRIC says a new unified soil classification method is under development.
  The files are in EPSG:4326 although the ISRIC catalogue record states Homolosine. The VRTs
  reference their tiles by relative path, so open them over HTTPS with GDAL's /vsicurl rather than
  downloading the .vrt alone, and read windows. Probabilities of the 30 groups in a cell do not
  always sum to exactly 100 because of rounding.

