      - name: crop_area
        description: Physical area of the crop in the cell, counted once per year regardless of harvests.
        data_type: float32
        unit: km2
        note: Absolute quantity; sum across cells for regional totals.
  - name: harvested-area
    dimensions: [*cell, *crop]
    variables:
      - name: harvested_area
        description: Harvested area of the crop in the cell, counting each harvest in the year.
        data_type: float32
        unit: km2
        note: Absolute quantity; sum across cells for regional totals.

cdh:
  domain: [agricultural-production]
  usage:
    intended_uses:
      - global and regional mapping of crop distribution and cropping intensity
      - crop-specific exposure layers for hazard, land-use, and sustainability assessment
      - spatial targeting at national and sub-national scale
    not_recommended_for:
      - use: field-scale farm management
        reason: the grid is too coarse for field-scale operational decisions.
        use_instead: local survey or administrative crop area data.
      - use: crop production or yield estimates
        reason: the dataset holds area only.
        use_instead: MapSPAM 2020 for gridded production and yield.

