processing:
  - id: source
    description: >
      FAO Python re-implementation of the CROPGRIDS pipeline (Bottini et al. 2025): inputs
      harmonized to the grid, ranked by quality, mosaicked, gap-filled with the FAO cropland
      agreement map, and scaled to FAOSTAT 2020 national totals. Code not public as of this record.
    date: "2025-04-14"
    derived_from:
      - url: https://www.fao.org/faostat/en/#data/QCL
        title: FAOSTAT Crops and livestock products (QCL), 2020 national totals
      - url: https://doi.org/10.5194/essd-15-4997-2023
        title: Cropland area database by country circa 2020 (cropland agreement map)

data:
  - name: crop-area
    structures: [crop-area]
    locations:
      - url: https://storage.googleapis.com/fao-gismgr-faostat-data/DATA/FAOSTAT/MAPSET/CG-CA/
        title: HTTPS
      - url: gs://fao-gismgr-faostat-data/DATA/FAOSTAT/MAPSET/CG-CA/
        title: GCS
    href_template: "FAOSTAT.CG-CA.2020.{crop}.tif"
    processing_steps: [source]
    description: >
      One COG per crop, about 540 MB in total. The folder also holds four byte-identical duplicates
      with truncated names (CASHEWAPPL, CAULIFLOWE, CUCUMBERET, SWEETPOTAT); ignore them.
    media_type: "image/tiff; application=geotiff; profile=cloud-optimized"
  - name: harvested-area
    structures: [harvested-area]
    locations:
      - url: https://storage.googleapis.com/fao-gismgr-faostat-data/DATA/FAOSTAT/MAPSET/CG-HA/
        title: HTTPS
      - url: gs://fao-gismgr-faostat-data/DATA/FAOSTAT/MAPSET/CG-HA/
        title: GCS
    href_template: "FAOSTAT.CG-HA.2020.{crop}.tif"
    processing_steps: [source]
    description: One COG per crop, about 530 MB in total.
    media_type: "image/tiff; application=geotiff; profile=cloud-optimized"

