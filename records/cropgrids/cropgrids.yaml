# yaml-language-server: $schema=https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.4.1/schemas/profiles/cdh.schema.bundled.json
# FAO-published CROPGRIDS crop and harvested area maps, federated from FAO's public bucket.
cdh_schema_version: "v0.4.1"
extensions:
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.4.1/extensions/cdh/schema.json
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.4.1/extensions/agriculture/schema.json

id: cropgrids
title: CROPGRIDS crop and harvested area for 2020 (FAO)
version: "2.0" # as labelled on the FAO data catalog
series:
  name: CROPGRIDS
  url: https://data.apps.fao.org/catalog/dataset/cropgrids
description: >
  CROPGRIDS maps physical crop area and harvested area for 173 crops circa 2020 on a global 0.05
  degree grid (about 5.6 km at the equator), fusing 27 gridded crop maps, subnational statistics
  from 52 countries, and FAOSTAT 2020 national totals. This is the FAO release, regenerated with
  FAO's Python pipeline, holding 171 of the crops as one GeoTIFF per crop and mapset. Crop area
  counts land once a year; harvested area counts every harvest, so it can exceed crop area under
  multiple cropping.
license: CC-BY-4.0 # as declared on the FAO data catalog
resource_type: dataset

keywords:
  - CROPGRIDS
  - crop maps
  - crop distribution
  - cropping intensity
  - gridded agriculture
  - FAOSTAT
  - term: multiple cropping
    scheme: https://agrovoc.fao.org/
    uri: http://aims.fao.org/aos/agrovoc/c_4986
  - term: land use
    scheme: https://agrovoc.fao.org/
    uri: http://aims.fao.org/aos/agrovoc/c_4182
note: >
  Values are modelled allocations, not observations. No nodata is set: ocean and cells without the
  crop hold 0. Totals differ from the figshare v1.08 release (Tang et al. 2024), so do not mix the
  two; that release's quality and source layers are not published here.

