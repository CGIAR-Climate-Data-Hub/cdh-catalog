created: "2026-08-28"
updated: "2026-10-07"

spatial:
  bbox: [-20.0, -40.0, 55.0, 40.0] # Africa (verified vs live COG: 1500 x 1600 cells at 0.05 deg)
  crs: EPSG:4326
  geography: [africa]

temporal:
  start_date: "1981-01"
  end_date: null # open-ended; monthly files are appended as CHIRPS v3 is released

# The monthly and seasonal file sets sit on different time axes, so each is its own structure.
structures:
  - name: monthly
    dimensions:
      - &cell
        name: cell
        type: xy
        description: 0.05 deg (~5.5 km, CHIRPS native).
        step: 0.05
        unit: degree
      - name: time
        type: temporal
        description: Month of the monthly totals (YYYY-MM); the {time} token of the monthly asset.
        extent: ["1981-01", "2026-04"]
        step: P1M
    variables:
      - &ptot
        name: PTOT
        description: Total precipitation over the period (calendar month, or 3-month seasonal sum).
        data_type: float32
        unit: mm
  - name: seasonal
    dimensions:
      - *cell
      - name: season
        type: season
        description: >
          Rolling 3-month window named by the initials of its months (JFM = Jan-Mar ... DJF = Dec-Feb).
          Each value covers three months; NDJ and DJF span the year boundary and are labelled by the
          year in which they end.
        values: [JFM, FMA, MAM, AMJ, MJJ, JJA, JAS, ASO, SON, OND, NDJ, DJF]
      - name: year
        type: temporal
        description: Year in which a seasonal window ends.
        extent: ["1981", "2026"]
        step: P1Y
    variables:
      - *ptot

processing:
  - id: source
    description: CHIRPS v3.0 quasi-global daily/monthly precipitation (station + infrared blend).
    derived_from:
      - title: CHIRPS v3.0 data portal (Climate Hazards Center)
        url: https://data.chc.ucsb.edu/products/CHIRPS/v3.0/
        version: v3.0
      - title: CDH catalog record chirps-v3-daily
        id: chirps-v3-daily
  - id: monthly-cog
    description: Monthly PTOT over the Africa window, written as COGs with internal overviews.
    code:
      url: https://github.com/AdaptationAtlas/hazards_prototype
      version: R/observational
  - id: seasonal-sum
    description: Per-year tri-month sums over the twelve seasonal windows, written as COGs with overviews.
    code:
      url: https://github.com/AdaptationAtlas/hazards_prototype
      version: R/observational/5b_make_obs_seasonal_rasters.R

data:
  - name: monthly
    structures: [monthly]
    description: Per-pixel monthly precipitation totals, one COG per month.
    locations:
      - url: https://digital-atlas.s3.amazonaws.com/domain=climate/type=observational/source=chirps-chirts-era5/region=africa/processing=monthly/
        title: HTTPS
      - url: s3://digital-atlas/domain=climate/type=observational/source=chirps-chirts-era5/region=africa/processing=monthly/
        title: S3
    href_template: "variable={variable}/{variable}-{time}.tif" # e.g. variable=PTOT/PTOT-2020-04.tif
    media_type: image/tiff; application=geotiff; profile=cloud-optimized
    file_size: 5 MB
    processing_steps: [source, monthly-cog]
  - name: seasonal
    structures: [seasonal]
    description: Per-year rolling 3-month precipitation sums, one COG per season x year.
    locations:
      - url: https://digital-atlas.s3.amazonaws.com/domain=climate/type=observational/source=chirps-chirts-era5/region=africa/processing=seasonal/
        title: HTTPS
      - url: s3://digital-atlas/domain=climate/type=observational/source=chirps-chirts-era5/region=africa/processing=seasonal/
        title: S3
    # Not every season x year exists, so the files are listed rather than templated.
    file_index:
      - format: cdh-inventory
        title: Seasonal file inventory
        locations:
          - url: https://raw.githubusercontent.com/CGIAR-Climate-Data-Hub/cdh-catalog/main/records/africa-precipitation-monthly-seasonal/seasonal-files.csv
        media_type: text/csv
    media_type: image/tiff; application=geotiff; profile=cloud-optimized
    processing_steps: [source, monthly-cog, seasonal-sum]

cdh:
  domain: [climate]
  usage:
    intended_uses:
      - Seasonal and ENSO-phase rainfall analysis and anomaly context in the KE-ENSO Explorer.
      - Rainfall driver for interpreting the drought (SPEI), vegetation (NDVI) and flood layers.
    not_recommended_for:
      - use: Daily or sub-monthly rainfall analysis.
        reason: Only monthly totals and 3-month sums are published here.
        use_instead: The CHIRPS v3 daily archive (catalog record chirps-v3-daily).
