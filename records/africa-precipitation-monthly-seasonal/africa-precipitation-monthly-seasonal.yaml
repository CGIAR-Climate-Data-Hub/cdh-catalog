# yaml-language-server: $schema=https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.4.1/schemas/profiles/cdh.schema.bundled.json
# CHIRPS v3 monthly Africa rewritten as COGs, plus seasonal sums derived from them (Adaptation Atlas).
cdh_schema_version: v0.4.1
extensions:
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.4.1/extensions/cdh/schema.json

id: africa-precipitation-monthly-seasonal
title: Monthly and Seasonal Precipitation from CHIRPS v3 (Africa)
version: "1"
series:
  name: Africa Agriculture Adaptation Atlas
  url: https://adaptationatlas.cgiar.org/
description: >
  Total precipitation (PTOT) from the CHIRPS v3.0 monthly Africa product, delivered as per-pixel
  monthly Cloud Optimized GeoTIFFs and per-year rolling 3-month (seasonal) sums, 1981 to present.
  The monthly files hold the same values as CHIRPS on the same 0.05° grid, with the -9999 sentinel
  masked and overviews added. The seasonal sums cover the twelve rolling tri-month windows (JFM,
  FMA, ..., DJF) and are derived from the monthly files.
resource_type: dataset
license: CC-BY-4.0 # Atlas-processed COGs; CHIRPS source is public domain
attribution: Derived from CHIRPS v3, Climate Hazards Center, UC Santa Barbara.

keywords:
  [
    precipitation,
    rainfall,
    CHIRPS,
    PTOT,
    monthly,
    seasonal,
    Africa,
    ENSO,
    drought,
  ]

note: >
  Seasonal windows are labelled by the calendar year in which the window ends (DJF_2020 = Dec 2019
  to Feb 2020). Edge windows that the record cannot cover in full are absent (NDJ and DJF 1981;
  windows ending after the latest monthly file).

