# yaml-language-server: $schema=https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.4.0/schemas/profiles/cdh.schema.bundled.json
# CHIRPS-derived monthly + seasonal precipitation COGs (KE-ENSO Explorer, Adaptation Atlas).
# Renamed from `africa-precipitation-chirps` after review (cdh-metadata-standard#32): this is an Atlas
# aggregation product derived from CHIRPS v3 (catalog record `chirps-v3-daily`), not a subset of it.
cdh_schema_version: v0.4.0
extensions:
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.4.0/extensions/cdh/schema.json

id: africa-precipitation-monthly-seasonal
title: Monthly and Seasonal Precipitation from CHIRPS v3 (Africa)
version: "1"
series:
  name: Africa Agriculture Adaptation Atlas
  url: https://adaptationatlas.cgiar.org/
description: >
  Total precipitation (PTOT) aggregated from CHIRPS v3.0 and delivered as per-pixel monthly Cloud
  Optimized GeoTIFFs and per-year rolling 3-month (seasonal) sums over Africa, 1981 to present.
  This is the rainfall backbone of the KE-ENSO Explorer's seasonal/ENSO analysis: the twelve
  seasonal windows (JFM, FMA, ..., DJF) are the tri-month sums the notebook compares against ENSO
  phase and against the drought (SPEI), vegetation (NDVI) and flood layers. A derived aggregation
  product, not a redistribution of the CHIRPS daily archive.
resource_type: dataset
license: CC-BY-4.0 # Atlas-processed COGs; CHIRPS source is public domain (credit CHC / UC Santa Barbara)

keywords:
  [
    precipitation,
    rainfall,
    CHIRPS,
    PTOT,
    monthly,
    seasonal,
    Africa,
    ENSO,
    drought,
  ]

note: >
  Source CHIRPS is public domain ("no restrictions on use"); these reprocessed COGs are released
  CC-BY-4.0 with attribution to the Climate Hazards Center, UC Santa Barbara. Seasonal windows are
  labelled by the calendar year in which the window ends (DJF_2020 = Dec 2019 to Feb 2020). Edge
  windows that the record cannot cover in full are absent (NDJ and DJF 1981; windows ending after
  the latest monthly file), so the seasonal asset lists its files in an inventory rather than a
  template.

