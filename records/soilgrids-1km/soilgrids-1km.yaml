# yaml-language-server: $schema=https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/schemas/profiles/cdh.schema.bundled.json
# 1 km lat/lon Zarr copy of the SoilGrids 2.0 mean maps. Separate from soilgrids-250m: reprojected,
# aggregated, and a different variable and depth set.
cdh_schema_version: v0.5.0
extensions:
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/cdh/schema.json

id: soilgrids-1km
parent: soilgrids-250m
title: SoilGrids 2.0 global soil property maps at 1 km
version: "2.0" # the SoilGrids version it carries; the Zarr has no release label of its own
series:
  name: SoilGrids
  url: https://www.isric.org/explore/soilgrids
description: >
  The SoilGrids 2.0 mean predictions of twelve soil properties at five standard depths from 0 to
  100 cm, as one Zarr datacube on a regular 1/120 degree (about 1 km) latitude and longitude grid.
  The properties are bulk density, cation exchange capacity, coarse fragments, clay, sand, silt,
  total nitrogen, pH in water, organic carbon content, and volumetric water content at -10, -33
  and -1500 kPa. Values are ISRIC's 1000 m aggregated maps, reprojected with nearest-neighbour
  resampling so every value is one ISRIC published. The store is chunked for point profiles and
  bounding-box reads over HTTPS without downloading the whole dataset.
license: CC-BY-4.0
resource_type: dataset

keywords:
  - SoilGrids
  - ISRIC
  - Zarr
  - analysis-ready data
  - bulk density
  - coarse fragments
  - water retention
  - term: digital soil mapping
    scheme: https://agrovoc.fao.org/
    uri: http://aims.fao.org/aos/agrovoc/c_e4975629
  - term: soil properties
    scheme: https://agrovoc.fao.org/
    uri: http://aims.fao.org/aos/agrovoc/c_330883
  - term: soil organic carbon
    scheme: https://agrovoc.fao.org/
    uri: http://aims.fao.org/aos/agrovoc/c_389fe908
  - term: soil texture
    scheme: https://agrovoc.fao.org/
    uri: http://aims.fao.org/aos/agrovoc/c_7199
  - term: cation exchange capacity
    scheme: https://agrovoc.fao.org/
    uri: http://aims.fao.org/aos/agrovoc/c_24981
  - term: soil pH
    scheme: https://agrovoc.fao.org/
    uri: http://aims.fao.org/aos/agrovoc/c_34901
note: >
  Mean maps only: no percentiles or uncertainty layers, no organic carbon density or stock, and no
  100-200 cm layer; use soilgrids-250m for those. Values are stored as int16 with a scale_factor:
  xarray returns conventional units, GDAL (3.11 or newer for Zarr v3) returns the stored integers.
  Nearest-neighbour reprojection duplicates or skips source cells where the 1 km equal-area grid and
  the 1/120 degree grid differ in shape, chiefly at high latitudes. Texture fractions are predicted
  independently, so clay, silt and sand sum to close to but not exactly 100%.

contact:
  - organization: ISRIC - World Soil Information
    roles: [licensor, producer]
    email: soilgrids@isric.org
    url: https://www.isric.org/
  - name: Andres Aguilar Ariza
    roles: [processor]
    email: Andres.Aguilar@cgiar.org
    organization: Alliance of Bioversity International and CIAT
  - name: Brayden Youngberg
    roles: [maintainer, point-of-contact]
    email: b.youngberg@cgiar.org
    organization: Alliance of Bioversity International and CIAT

# ISRIC asks that the maps be cited through the SoilGrids 2.0 paper.
citation:
  title: "SoilGrids 2.0: producing soil information for the globe with quantified spatial uncertainty"
  authors:
    - family: Poggio
      given: L.
    - family: de Sousa
      given: L. M.
    - family: Batjes
      given: N. H.
    - family: Heuvelink
      given: G. B. M.
    - family: Kempen
      given: B.
    - family: Ribeiro
      given: E.
    - family: Rossiter
      given: D.
  date: "2021"
  publisher: SOIL
  url: https://doi.org/10.5194/soil-7-217-2021

created: "2026-11-16"
updated: "2026-11-16"

spatial:
  bbox: [-180, -60, 180, 84]
  geography: [world]
  crs: EPSG:4326

temporal:
  date: "2020" # static maps; fitted on the March 2020 WoSIS snapshot and published May 2020

structures:
  - name: zarr
    dimensions:
      - name: cell
        type: xy
        description: 1/120 degree cells (~926 m at the equator). lat runs north to south.
        step: 0.008333333333333333
        unit: degree
      - name: depth
        type: z
        description: Layer midpoint (0-5, 5-15, 15-30, 30-60, 60-100 cm); depth_bnds gives each layer's top and bottom.
        unit: cm
        data_type: float64
        values: [2.5, 10, 22.5, 45, 80]
    # Units are the decoded ones xarray returns; GDAL returns the stored integers.
    variables:
      - name: bdod
        description: Bulk density of the fine earth fraction.
        data_type: int16
        unit: kg dm-3
        nodata: -32768
        note: Stored in cg cm-3 with scale_factor 0.01.
      - name: cec
        description: Cation exchange capacity of the soil at pH 7.
        data_type: int16
        unit: cmol kg-1
        nodata: -32768
        note: Charge-equivalent cmol(c)/kg. Stored in mmol(c)/kg with scale_factor 0.1.
      - name: cfvo
        description: Volumetric fraction of coarse fragments larger than 2 mm.
        data_type: int16
        unit: "%"
        nodata: -32768
        note: Volume percent. Stored in cm3 dm-3 with scale_factor 0.1.
      - name: clay
        description: Proportion of clay particles smaller than 0.002 mm in the fine earth fraction.
        data_type: int16
        unit: "%"
        nodata: -32768
        note: Mass percent. Stored in g kg-1 with scale_factor 0.1.
      - name: nitrogen
        description: Total nitrogen.
        data_type: int16
        unit: g kg-1
        nodata: -32768
        note: Stored in cg kg-1 with scale_factor 0.01.
      - name: phh2o
        description: Soil pH in water.
        data_type: int16
        unit: "[pH]"
        nodata: -32768
        note: Stored as pH times 10 with scale_factor 0.1.
      - name: sand
        description: Proportion of sand particles larger than 0.05 mm in the fine earth fraction.
        data_type: int16
        unit: "%"
        nodata: -32768
        note: Mass percent. Stored in g kg-1 with scale_factor 0.1.
      - name: silt
        description: Proportion of silt particles between 0.002 and 0.05 mm in the fine earth fraction.
        data_type: int16
        unit: "%"
        nodata: -32768
        note: Mass percent. Stored in g kg-1 with scale_factor 0.1.
      - name: soc
        description: Soil organic carbon content in the fine earth fraction.
        data_type: int16
        unit: g kg-1
        nodata: -32768
        note: Stored in dg kg-1 with scale_factor 0.1.
      - &wv
        name: wv0010
        description: Volumetric water content at -10 kPa.
        data_type: int16
        unit: "%"
        nodata: -32768
        note: Volume percent. Stored in 10-3 cm3 cm-3 with scale_factor 0.1.
      - {
          <<: *wv,
          name: wv0033,
          description: Volumetric water content at -33 kPa (field capacity).,
        }
      - {
          <<: *wv,
          name: wv1500,
          description: Volumetric water content at -1500 kPa (wilting point).,
        }

cdh:
  domain: [land, agricultural-production]
  usage:
    intended_uses:
      - soil inputs to crop, hydrological, and carbon models at national to global scale
      - soil constraint and land suitability mapping
      - point soil profiles and regional extracts without reprojecting
    not_recommended_for:
      - use: field-scale soil management or fertilizer recommendations
        reason: values are 1 km aggregates of model predictions, not measurements.
        use_instead: local soil surveys or soil tests.
      - use: analyses that need prediction uncertainty
        reason: only the mean maps are included.
        use_instead: soilgrids-250m, which has quantiles and uncertainty layers.

processing:
  - id: source
    description: >
      ISRIC's SoilGrids 2.0 1000 m aggregated mean maps, one GeoTIFF per property and depth in the
      Interrupted Goode Homolosine projection.
    derived_from:
      - url: https://files.isric.org/soilgrids/latest/data_aggregated/1000m/
        title: SoilGrids 2.0 aggregated 1000 m maps
        version: "2.0"
  - id: cloud-optimize
    description: >
      Reproject each map onto a 1/120 degree EPSG:4326 grid with nearest-neighbour resampling and
      stack them into one Zarr v3 store, keeping ISRIC's int16 values and adding a scale_factor.
    date: "2026-11-14"

data:
  - name: zarr
    structures: [zarr]
    locations:
      - url: https://huggingface.co/datasets/aaguilar90/soilgrids-v2-1km/resolve/main/soilgrids-v2-1km.zarr
        title: HTTPS
    description: >
      Zarr v3 store, one int16 (depth, lat, lon) array per property, chunked 5 depths x 480 x 480
      cells (4 degrees square) for point profiles and bounding-box reads.
    media_type: application/vnd.zarr; version=3
    file_size: 8.7 GB
    processing_steps: [source, cloud-optimize]

additional_links:
  - title: Hugging Face dataset page
    rel: describedby
    url: https://huggingface.co/datasets/aaguilar90/soilgrids-v2-1km
    description: Variable table, usage examples for Python, R and QGIS, and caveats.
  - title: SoilGrids FAQ
    rel: describedby
    url: https://docs.isric.org/globaldata/soilgrids/SoilGrids_faqs.html
  - title: SoilGrids 2.0 at 250 m with quantiles and uncertainty
    rel: related
    id: soilgrids-250m
