id: chinyanja-soy-validation
version: '1'
title: Soy advisory tool validation trials in the Chinyanja Triangle (Malawi, Zambia, Mozambique)
description: On-station and on-farm validation datasets from the Chinyanja Triangle covering nutrient-omission trials, planting
  windows, varieties, crop arrangement and management of maize and soybean in Malawi, Zambia and Mozambique. The data record
  crop physiology, growth, yield and soil characteristics used to validate soybean advisory-tool recommendations.
license: CC-BY-4.0
resource_type: dataset
access: public
note: The asset template listed no repository for this entry; the linked IITA dataset is the on-farm validation trial data
  matching the described scope (planting window, variety, nutrient management). The individual CKAN resource download URLs
  currently return 404 at the source, so the dataset landing page and registered DOI are provided in place of the per-file
  links.
